const PROC2={
r1:["Porta a bollore abbondante acqua salata (10 g di sale per litro) e butta la pasta.","In una padella scalda l'olio con uno spicchio d'aglio schiacciato, versa la passata e cuoci 10-12 minuti a fuoco medio con qualche foglia di basilico.","Scola la pasta al dente tenendo da parte un mestolo d'acqua di cottura.","Salta la pasta nel sugo 1 minuto, allungando con l'acqua tenuta da parte se serve.","Spegni, manteca con il parmigiano e completa con basilico fresco."],
r2:["Trita finemente la cipolla e falla appassire in un tegame con l'olio, 5 minuti a fuoco dolce senza farla colorire.","Unisci il riso e tostalo 2 minuti mescolando, finché i chicchi diventano traslucidi.","Aggiungi i piselli ancora surgelati e copri con acqua calda (o brodo) due dita sopra il riso.","Cuoci 15-16 minuti aggiungendo acqua calda poco alla volta quando viene assorbita.","Spegni al dente: deve restare 'all'onda'. Manteca con il parmigiano e lascia riposare 2 minuti."],
r5:["Rassoda l'eventuale uovo extra se lo gradisci; sgocciola bene il tonno dall'olio di conserva.","Lava e asciuga l'insalata, taglia i pomodori a spicchi.","Riunisci in una ciotola capiente insalata, pomodori, tonno spezzettato e mais sgocciolato.","Condisci con olio, sale e un giro di aceto o limone solo al momento di servire."],
r8:["Cuoci la pasta in abbondante acqua salata.","Stempera il pesto in una ciotola larga con un mestolino d'acqua di cottura: mai scaldarlo sul fuoco, perderebbe profumo e colore.","Scola la pasta al dente direttamente nella ciotola.","Mescola bene, completa con parmigiano e, se ti piace, qualche pinolo tostato."],
p1:["Taglia il guanciale a listarelle ed eliminane la cotenna. Rosolalo in padella fredda senza olio, a fuoco medio, finché è dorato e croccante (8-10 minuti). Spegni e tieni da parte il grasso.","Nel frattempo cuoci gli spaghetti in acqua poco salata (il condimento è già sapido).","In una ciotola sbatti i tuorli con il pecorino e abbondante pepe fino a ottenere una crema densa.","Scola la pasta al dente nella padella del guanciale, salta 30 secondi sul fondo di cottura.","Fuori dal fuoco versa la crema di tuorli e mescola energicamente, allungando con acqua di cottura fino a una crema lucida: il calore della pasta cuoce l'uovo senza stracciarlo.","Servi subito con altro pecorino e pepe."],
p2:["Rosola il guanciale a listarelle in padella fredda finché è croccante; toglilo e lascia il grasso.","Nel grasso versa i pelati schiacciati e cuoci 15 minuti a fuoco vivo, regolando di sale.","Cuoci la pasta molto al dente e trasferiscila nel sugo.","Salta 1-2 minuti, rimetti il guanciale, spegni e manteca con il pecorino."],
p3:["Cuoci la pasta in acqua poco salata: l'amido servirà per la crema, quindi usa meno acqua del solito.","Macina abbondante pepe nero e tostalo 30 secondi in padella a secco.","Metti il pecorino in una ciotola e stemperalo con acqua di cottura fredda di un grado, mescolando fino a una crema senza grumi.","Scola la pasta 2 minuti prima del tempo e finisci la cottura in padella con acqua di cottura.","Fuori dal fuoco unisci la crema di pecorino e manteca vigorosamente fino a una salsa lucida."],
p4:["Affetta sottilmente l'aglio e mettilo in padella con l'olio a freddo, con peperoncino a piacere.","Scalda a fuoco dolcissimo finché l'aglio è appena dorato: mai bruciarlo, diventerebbe amaro.","Cuoci la pasta al dente e trasferiscila in padella con un mestolo d'acqua.","Salta 1 minuto emulsionando, spegni e completa con prezzemolo tritato."],
p5:["Scalda olio, aglio e peperoncino in padella a fuoco dolce 2 minuti.","Unisci i pelati schiacciati e cuoci a fuoco vivo 12-15 minuti: il sugo deve restringersi.","Cuoci le penne al dente e saltale nel sugo 1 minuto.","Completa con prezzemolo e, se piace, pecorino."],
p6:["Appassisci la cipolla tritata nell'olio 5 minuti a fuoco dolce.","Unisci il tonno sgocciolato e sfaldalo; dopo 2 minuti versa la passata.","Cuoci 10 minuti a fuoco medio e regola di sale.","Salta la pasta al dente nel sugo con poca acqua di cottura."],
p7:["Taglia le zucchine a rondelle sottili e saltale a fuoco vivo con olio e aglio finché sono dorate ma sode.","Unisci i gamberetti e cuoci 2-3 minuti: non di più o diventano gommosi.","Cuoci la pasta al dente e trasferiscila in padella.","Manteca con acqua di cottura e finisci con prezzemolo."],
p8:["Scalda l'olio con il rosmarino e uno spicchio d'aglio 2 minuti.","Versa i ceci sgocciolati; frullane la metà con un mestolo d'acqua e rimettila in pentola: darà cremosità.","Copri con acqua calda, porta a bollore e cala la pasta corta.","Cuoci mescolando spesso finché la pasta è al dente e la zuppa cremosa; servi con un giro d'olio a crudo."],
p9:["Soffriggi la cipolla tritata nell'olio; unisci la passata e cuoci 5 minuti.","Aggiungi i fagioli (frullane metà per la cremosità) e copri con acqua calda.","Al bollore cala la pasta e cuoci mescolando: l'amido legherà la zuppa.","Spegni al dente, riposa 2 minuti e servi con olio a crudo e pepe."],
p10:["Prepara il ragù: soffriggi un trito di cipolla, rosola il macinato a fuoco vivo finché è ben colorito, versa la passata e cuoci almeno 30 minuti (meglio 1 ora) a fuoco basso.","Prepara la besciamella: sciogli il burro, unisci la farina mescolando 2 minuti, versa il latte caldo a filo e cuoci finché vela il cucchiaio; sala e, se piace, noce moscata.","Nella teglia alterna: velo di ragù, sfoglie, ragù, besciamella e parmigiano, per 4-5 strati, finendo con besciamella e parmigiano.","Inforna a 180° per 40 minuti, finché la superficie è dorata e gli angoli sfrigolano.","Fondamentale: lascia riposare 10 minuti prima di tagliare, così gli strati si compattano."],
p11:["Cuoci la pasta 2 minuti meno del tempo indicato: finirà di cuocere in forno.","Condiscila con la passata scaldata con olio e sale, il prosciutto a striscioline e metà del parmigiano.","Versa in una teglia oliata, distribuisci la mozzarella a cubetti ben scolata e il resto del parmigiano.","Gratina in forno a 200° per 15-20 minuti finché la superficie è dorata e filante."],
p12:["Scalda il sugo di pomodoro con olio e basilico per 10 minuti.","Lessa gli gnocchi in acqua salata e scolali appena vengono a galla.","Condiscili con il sugo in una pirofila, distribuisci la mozzarella a cubetti e il parmigiano.","Gratina 10 minuti sotto il grill finché la mozzarella fila e fa la crosticina."],
p13:["Porta a bollore il brodo (anche di dado) e tienilo caldo.","Tosta il riso a secco 2 minuti, poi sfuma se vuoi con mezzo bicchiere di vino bianco.","Porta a cottura aggiungendo brodo caldo un mestolo alla volta, mescolando, per 15-16 minuti.","Sciogli lo zafferano in poco brodo e uniscilo a fine cottura.","Fuori dal fuoco manteca con burro freddo e parmigiano; copri 2 minuti e servi all'onda."],
p14:["Pulisci i funghi con un panno umido e affettali; saltali a fuoco vivo con poco olio finché perdono l'acqua. Tieni da parte.","Appassisci la cipolla, tosta il riso 2 minuti.","Porta a cottura col brodo caldo, un mestolo alla volta, mescolando.","A 5 minuti dalla fine unisci i funghi.","Manteca fuori dal fuoco con burro e parmigiano; prezzemolo per finire."],
p15:["Taglia la zucca a dadini piccoli e rosolala con la cipolla nell'olio 10 minuti: deve iniziare a disfarsi.","Unisci il riso e tostalo 2 minuti insieme al condimento.","Porta a cottura con brodo caldo mescolando; la zucca si scioglierà formando la crema.","Manteca con burro e parmigiano; ottimo con una macinata di pepe."],
p16:["Lessa il riso in acqua salata, scolalo al dente e raffreddalo sotto acqua fredda per fermare la cottura.","Sgocciola tonno, mais e olive; taglia i pomodorini a metà.","Mescola tutto in una ciotola con un filo d'olio.","Riposa in frigo almeno 30 minuti: freddo è ancora più buono."],
p17:["Porta a bollore un volume d'acqua pari al couscous con un filo d'olio e sale; spegni, versa il couscous, copri 5 minuti, poi sgranalo con la forchetta.","Taglia zucchine, peperoni e carote a dadini piccoli e saltali a fuoco vivo 8-10 minuti: devono restare croccanti.","Mescola couscous e verdure; regola di sale.","Servi tiepido o freddo, con menta o limone se gradisci."],
p18:["Rassoda le uova: 9 minuti dal bollore, poi in acqua fredda.","Lava l'insalata, taglia i pomodori, sgocciola tonno e mais.","Componi l'insalatona con le uova a spicchi.","Condisci al momento con olio, sale e aceto o limone."],
p19:["Lessa il farro in acqua salata per il tempo indicato sulla confezione (25-30 minuti); scola e raffredda.","Taglia i pomodorini e la mozzarella a cubetti, scolando bene quest'ultima.","Unisci tutto al farro con basilico spezzettato.","Condisci con olio e sale; meglio dopo 20 minuti di frigo."],
p20:["Spurga le vongole 2 ore in acqua fredda salata; sciacquale bene.","Aprile in padella coperta a fuoco vivo con olio e aglio: 3-4 minuti. Elimina quelle chiuse e filtra il fondo.","Cuoci gli spaghetti molto al dente.","Saltali in padella col fondo delle vongole 2 minuti, unendo acqua di cottura: l'amido creerà la cremina.","Rimetti le vongole, spegni, prezzemolo e pepe. Mai formaggio."],
p21:["Pulisci le cime di rapa tenendo foglie e fiori.","Buttale nell'acqua bollente salata insieme alla pasta: cuoceranno insieme.","Intanto scalda olio, aglio e peperoncino (con un'acciuga se piace).","Scola pasta e cime e saltale in padella 2 minuti schiacciando un po' le verdure."],
p22:["Porta a bollore il brodo: se usi il dado, un pezzo per mezzo litro.","Cala i tortellini e cuoci i minuti indicati sulla confezione: appena tornano a galla assaggia.","Servi nel brodo bollente con abbondante parmigiano."],
p23:["Scalda la piadina in padella a secco 30 secondi per lato.","Farciscila con il crudo, la mozzarella ben scolata a fette e la rucola.","Chiudi a metà e ripassala 1 minuto per lato se la vuoi calda e filante."],
x1:["Spezzetta il salmone avanzato eliminando eventuali parti secche.","Scaldalo dolcemente in padella con olio e scorza di limone: deve solo insaporirsi, non ricuocere.","Cuoci la pasta al dente e saltala nel condimento con acqua di cottura.","Finisci con succo di limone e pepe."],
x2:["Taglia il pollo avanzato a striscioline.","Prepara la base di insalata e pomodori.","Unisci il pollo e condisci con olio, sale e limone: la citronette rinfresca la carne del giorno prima."],
x5:["Sbatti le uova con parmigiano, sale e pepe in una ciotola capiente.","Unisci la pasta avanzata (condita va benissimo) e mescola bene.","Versa in padella antiaderente ben calda con olio; compatta e cuoci 4-5 minuti a fuoco medio.","Girala aiutandoti con un piatto e dora l'altro lato: fuori croccante, dentro morbida."],
r3:["Taglia le patate a tocchetti e mettile in acqua fredda 10 minuti per togliere l'amido.","Rosola il petto di pollo in padella 2 minuti per lato: sigillarlo trattiene i succhi.","In teglia unisci pollo, patate scolate e asciugate, rosmarino, olio e sale.","Inforna a 200° per 35 minuti girando le patate a metà cottura.","Lascia riposare il pollo 5 minuti prima di tagliarlo."],
r4:["Salta le zucchine a rondelle con la cipolla nell'olio finché sono morbide; falle intiepidire.","Sbatti le uova con sale e pepe, unisci le verdure.","Versa in padella antiaderente calda con un filo d'olio; cuoci a fuoco dolce 6-7 minuti coperto.","Gira la frittata con l'aiuto di un piatto e finisci 3 minuti dall'altro lato."],
r6:["Fai un soffritto leggero con olio e cipolla (o porro).","Unisci le verdure surgelate e le patate a dadini; mescola 2 minuti.","Copri con acqua calda, sala e cuoci 25-30 minuti a fuoco medio.","Cala la pasta piccola e cuoci il tempo indicato.","Servi con parmigiano e un giro d'olio a crudo."],
r7:["Batti leggermente le fettine se spesse.","Passale nell'uovo sbattuto salato e poi nel pangrattato, premendo bene.","Friggi in olio ben caldo (o burro chiarificato) 2-3 minuti per lato fino a doratura.","Scola su carta assorbente, sala e servi con insalata condita."],
r9:["Porta il salmone a temperatura ambiente 15 minuti prima.","Cuoci i broccoli a vapore o lessali 6-7 minuti: devono restare verdi e sodi.","Scalda una padella con poco olio; cuoci il salmone partendo dal lato pelle 4 minuti, poi 2-3 dall'altro.","Condisci i broccoli con olio e limone; servi con il salmone e una macinata di pepe."],
r13:["Prepara un soffritto con carote e sedano a dadini nell'olio, 5 minuti.","Unisci i legumi sgocciolati e mescola per insaporire.","Copri a filo con acqua calda e cuoci 20 minuti.","Frulla una parte se la vuoi più cremosa; servi con olio a crudo e crostini."],
r14:["Se la base è fresca, tirala fuori dal frigo 30 minuti prima. Scalda il forno al massimo (250° se possibile) con la teglia dentro.","Condisci la passata con olio, sale e origano; stendila sulla base lasciando il bordo libero.","Inforna 8-10 minuti solo con il pomodoro.","Aggiungi la mozzarella ben scolata a pezzi e finisci 5-8 minuti finché il bordo è dorato.","Basilico fresco all'uscita."],
d1:["Ammolla il pane nel latte o acqua e strizzalo.","Impasta macinato, pane, uovo, parmigiano, sale e pepe; forma polpette da 40 g bagnandoti le mani.","Rosolale in padella con un filo d'olio per formare la crosticina.","Versa la passata, copri e cuoci 25 minuti a fuoco basso girandole a metà.","Riposo di 5 minuti: il sugo si addensa e le polpette restano tenere."],
d2:["Infarina i bocconcini scrollando l'eccesso.","Rosolali a fuoco vivo in olio caldo finché sono coloriti su tutti i lati; toglili.","Nella stessa pentola appassisci cipolla e carote, rimetti la carne, versa la passata e copri d'acqua calda.","Cuoci coperto a fuoco dolce 1 ora; unisci le patate a tocchetti e prosegui 25 minuti.","Il sugo deve risultare denso: scoperchia gli ultimi minuti se serve."],
d3:["Batti le fettine sottili e infarinale leggermente.","Sciogli il burro in padella e cuoci le fettine 1-2 minuti per lato; toglile.","Sfuma il fondo con il succo di limone e un mestolino d'acqua, raschiando il fondo.","Rimetti le scaloppine 1 minuto nella salsa lucida e servi subito."],
d4:["Su ogni fettina adagia una fetta di crudo e una foglia di salvia, fermando con uno stecchino.","Cuoci nel burro spumeggiante 2 minuti dal lato del prosciutto, 1 dall'altro.","Sfuma con poco vino bianco o acqua; la salsina si forma da sola.","Servi subito: 'salta in bocca' proprio perché va mangiato caldo."],
d5:["Porta l'hamburger a temperatura ambiente; salalo solo al momento della cottura.","Scalda bene padella o griglia: 3 minuti per lato senza schiacciarlo mai.","Tosta il pane tagliato a metà nella stessa padella.","Componi con insalata, pomodoro e le salse che ami."],
d6:["Affetta le patate sottili (3-4 mm) e disponile in teglia oliata; inforna da sole 10 minuti a 200°.","Adagia sopra i filetti di orata, sale, olio e fette di limone.","Inforna altri 15 minuti: il pesce è pronto quando si sfalda alla forchetta.","Un giro d'olio a crudo e prezzemolo per servire."],
d7:["Taglia zucchine a rondelle e pomodorini a metà.","Se al cartoccio: chiudi branzino e verdure con olio e sale nella carta forno; 20 minuti a 200°.","In padella: rosola prima le verdure 5 minuti, unisci i filetti pelle sotto e cuoci coperto 8-10 minuti.","Apri il cartoccio a tavola: il profumo è metà del piatto."],
d8:["Dora l'aglio nell'olio, versa la passata e cuoci 10 minuti con sale.","Adagia i filetti di merluzzo nel sugo.","Copri e cuoci 12-15 minuti senza girarli: si sfalderebbero.","Completa con prezzemolo; ottimo con pane per la scarpetta."],
d9:["Disponi i bastoncini su teglia con carta forno.","Inforna a 220° per 12-15 minuti girandoli a metà: verranno croccanti senza friggere.","Intanto lessa i piselli 5 minuti e condiscili con olio e sale.","Servi con spicchi di limone."],
d10:["Affetta le melanzane (1 cm), salale e lasciale spurgare 30 minuti; asciugale.","Grigliale finché sono morbide e segnate.","In pirofila alterna: sugo, melanzane, mozzarella e parmigiano, per 3-4 strati.","Inforna a 180° per 30 minuti; gli ultimi 5 col grill per gratinare.","Riposa 10 minuti prima di servire: si taglia meglio ed è più buona."],
d11:["Taglia le calotte dei peperoni e svuotali da semi e filamenti.","Mescola macinato, pangrattato, parmigiano, sale e un filo d'olio.","Riempi i peperoni senza pressare troppo e richiudi con le calotte.","Inforna a 180° per 40-45 minuti in teglia oliata, finché la carne è cotta e i peperoni si piegano."],
d12:["Scava le zucchine a barchetta tenendo la polpa.","Mescola la polpa tritata con macinato, pangrattato e parmigiano.","Farcisci le barchette e disponile in teglia oliata.","Inforna a 180° per 30 minuti finché il ripieno è dorato."],
d13:["Rosola la cipolla nell'olio; unisci zucca e patate a dadini.","Mescola 5 minuti, poi copri d'acqua calda e sala.","Cuoci 20-25 minuti finché tutto si schiaccia con la forchetta.","Frulla fino a crema liscia; regola la densità con acqua.","Servi con crostini di pane tostato e un giro d'olio."],
d14:["Usa ingredienti a temperatura ambiente: il frigo spegne i sapori.","Affetta pomodori e mozzarella dello stesso spessore.","Alterna le fette sul piatto, sala leggermente i pomodori.","Basilico spezzato a mano e olio buono: non serve altro."],
d15:["Cuoci gli spinaci in padella coperta con un filo d'acqua, poi ripassali col burro e sala.","In un'altra padella cuoci le uova al tegamino a fuoco dolce: albume sodo, tuorlo morbido.","Impiatta uova e spinaci col pane tostato."],
d16:["Porta le fettine a temperatura ambiente e ungile appena.","Grigliale su piastra rovente 2-3 minuti per lato senza muoverle: si formeranno le righe.","Lessa i fagiolini 8-10 minuti; condisci con olio e limone.","Sala la carne all'uscita e servi."],
d17:["Taglia le patate a spicchi e bucherella le salsicce.","Disponi tutto in teglia con rosmarino, olio e sale; mescola con le mani.","Inforna a 200° per 40 minuti girando a metà.","Le patate devono essere dorate e le salsicce lucide: se serve, 5 minuti di grill."],
d18:["Porta a bollore 4 volumi d'acqua salata per uno di farina; versa la polenta a pioggia mescolando con la frusta.","Cuoci 40 minuti mescolando spesso (o usa la versione istantanea in 8 minuti).","Intanto rosola la salsiccia a tocchi, poi falla insaporire nella passata 15 minuti.","Versa la polenta nei piatti e coprila con salsiccia e sugo."],
d19:["Tira fuori la bistecca dal frigo 30 minuti prima: mai cuocerla fredda.","Rovente la piastra: 3 minuti per lato per una cottura al sangue, sale solo dopo.","Fondamentale il riposo: 5 minuti su un tagliere, coperta, prima di affettarla.","Affetta contro fibra, adagia su un letto di rucola e finisci con olio e limone."],
d20:["Sciacqua le lenticchie; soffriggi cipolla e carote nell'olio.","Unisci le lenticchie e la passata; copri con acqua calda due dita sopra.","Cuoci 35 minuti a fuoco dolce, mescolando ogni tanto e aggiungendo acqua se asciuga.","Sala solo a fine cottura (prima indurirebbe le bucce); olio a crudo per servire."],
x3:["Ammolla il pane raffermo in acqua o latte e strizzalo bene.","Impastalo con uovo, parmigiano, sale e prezzemolo; forma polpettine.","Rosolale in padella, poi cuocile nella passata 15 minuti.","Povere per gli ingredienti, ricche di sapore: il piatto anti-spreco per eccellenza."],
x4:["Lessa il riso o usa quello avanzato.","Salta le verdure avanzate a fuoco vivo con olio.","Unisci il riso e padella viva 5 minuti mescolando: deve quasi 'friggere'.","Un uovo strapazzato dentro, se vuoi farlo alla cantonese."],
x6:["Lessa le patate con la buccia 30-35 minuti; pelale e schiacciale calde.","Impasta con uovo, parmigiano, sale e una noce di burro.","Stendi metà composto in teglia imburrata, distribuisci la mozzarella, copri col resto.","Pangrattato in superficie e forno a 180° per 30 minuti fino alla crosticina dorata."],
x7:["Taglia il pane raffermo a fette spesse e tostale in forno o padella.","Strofina ogni fetta con uno spicchio d'aglio.","Condisci i pomodori a dadini con olio, sale e basilico; lasciali insaporire 10 minuti.","Componi le bruschette solo al momento: il pane deve restare croccante."],
e1:["In padella larga cuoci cipolla e peperoni nell'olio 8 minuti.","Versa i pelati schiacciati, sala e cuoci 10 minuti finché il sugo si addensa.","Con un cucchiaio crea 2 conche nel sugo e rompici dentro le uova.","Copri e cuoci 6-8 minuti: albume rappreso, tuorlo cremoso.","Porta la padella in tavola con pane per la scarpetta."],
e2:["Taglia tutte le verdure a tocchetti regolari.","Rosola prima melanzane e peperoni, poi unisci zucchine, cipolla e pomodori.","Cuoci a fuoco dolce 35 minuti con coperchio, mescolando ogni tanto.","È pronta quando le verdure sono morbide ma non disfatte; meglio tiepida o l'indomani."],
e3:["Taglia le verdure e ammolla il pane in poca acqua.","Frulla tutto con olio, sale, un cucchiaio d'aceto e acqua fredda quanto basta.","Passa al colino se lo vuoi vellutato.","Almeno 2 ore di frigo: va servito ben freddo."],
e4:["Affetta i porri (solo la parte bianca e verde chiaro) e stufali nel burro o olio 10 minuti.","Unisci le patate a tocchetti, copri d'acqua e cuoci 20 minuti.","Frulla fino a vellutata liscia; riporta sul fuoco e unisci la panna.","Servi con crostini e una macinata di pepe."],
e5:["Marina il pollo a cubetti nello yogurt col curry, almeno 30 minuti (anche una notte).","Rosola il pollo scolato in padella ben calda finché è colorito.","Versa la passata, cuoci 15 minuti, poi unisci la panna e spegni.","Servi con riso basmati lessato: la salsa cremosa fa il piatto."],
e6:["Prepara il brodo con acqua, salsa di soia e, se hai, zenzero.","Rassoda l'uovo (7 minuti: tuorlo appena cremoso) e affetta il pollo cotto.","Cuoci i noodles nel brodo il tempo indicato.","Componi la ciotola: noodles, brodo, pollo, mezzo uovo e zucchine a julienne crude."],
e7:["Friggi le melanzane a cubetti in olio ben caldo; scolale su carta.","Nella stessa padella appassisci il sedano, unisci passata e olive; 10 minuti.","Rimetti le melanzane, un cucchiaio d'aceto e uno di zucchero: l'agrodolce è l'anima della caponata.","Spegni e lascia intiepidire: va mangiata tiepida o fredda, mai bollente."],
e8:["Taglia le patate a bastoncini, sciacquale e asciugale bene.","Inforna le patate con olio e sale a 210° per 15 minuti.","Impana il merluzzo nel pangrattato e uniscilo in teglia.","Cuoci altri 12-15 minuti finché pesce e patate sono dorati.","Servi con limone e, se piace, maionese."],
a1:["Rosola il pollo a cubetti in padella ben calda finché è dorato.","Spolvera col curry e tosta 1 minuto: le spezie si svegliano col calore.","Versa il latte di cocco e cuoci 15 minuti a fuoco dolce finché la salsa si addensa.","Servi sul basmati lessato in acqua salata (1 volume di riso, 1,5 di acqua)."],
a2:["Lessa il basmati e raffreddalo: il riso del giorno prima è perfetto.","Strapazza l'uovo in padella e tienilo da parte.","Salta il riso a fiamma viva con piselli e prosciutto a dadini.","Rimetti l'uovo, un cucchiaio di salsa di soia, salta 1 minuto e servi."],
a3:["Taglia le verdure a julienne sottile.","Lessa i noodles e scolali al dente.","Salta le verdure a fiamma viva 3 minuti: devono restare croccanti.","Unisci noodles e soia, salta 2 minuti mescolando in continuo."],
a4:["Taglia il pollo a bocconcini e le zucchine a mezzaluna.","Tosta le mandorle a secco in padella e tienile da parte.","Salta il pollo a fiamma viva, unisci le zucchine e cuoci 5 minuti.","Versa la soia, rimetti le mandorle e salta 1 minuto: la salsa deve velare tutto."],
a5:["Cuoci il salmone in padella partendo dalla pelle, 4 minuti, poi giralo.","In un pentolino riduci soia e miele finché diventa una glassa densa.","Spennella il salmone con la glassa e finisci 2 minuti.","Servi sul basmati con la glassa rimasta e, se hai, semi di sesamo."],
a6:["Lessa il basmati e lascialo intiepidire.","Taglia il salmone (abbattuto o cotto) a cubetti e l'avocado a fette.","Componi la ciotola: riso alla base, poi salmone, avocado e mais a spicchi ordinati.","Irrora di salsa di soia; è la disposizione a fare il poke."],
a7:["Sciacqua le lenticchie e mettile in pentola con curry e latte di cocco.","Copri d'acqua e cuoci 30 minuti mescolando ogni tanto.","Deve risultare una crema densa; sala a fine cottura.","Servi sul basmati: il dahl è il comfort food indiano per eccellenza."],
m1:["Rosola il macinato a fuoco vivo sgranandolo; condisci con paprika o spezie tex-mex.","Scalda le tortillas 20 secondi per lato in padella.","Prepara pomodoro a dadini e insalata a striscioline.","Ognuno compone il suo taco: carne, verdure e cheddar. Portata conviviale per definizione."],
m2:["Farcisci metà tortilla con cheddar, pollo cotto a pezzetti e peperoni saltati.","Chiudi a mezzaluna premendo bene.","Dora in padella 2-3 minuti per lato: fuori croccante, dentro filante.","Taglia a spicchi e servi calda."],
m3:["Scalda riso e fagioli; salta il pollo a striscioline.","Scalda la tortilla e disponi il ripieno al centro in una striscia.","Piega i lati corti e arrotola stretto.","Ripassa il burrito in padella 1 minuto per lato per sigillarlo."],
m4:["Taglia pollo, peperoni e cipolla a striscioline.","Salta il pollo a fiamma viva finché è dorato; toglilo.","Nella stessa padella salta le verdure 5 minuti, poi riunisci tutto con le spezie.","Porta in tavola nella padella con le tortillas calde: si compongono al momento."],
m5:["Rosola macinato e cipolla a fuoco vivo.","Unisci fagioli, pelati, mais e spezie (cumino e paprika se le hai).","Cuoci 30 minuti a fuoco dolce: deve addensarsi.","Ancora meglio riscaldato il giorno dopo; servi con pane o riso."],
u1:["Griglia il pollo e taglialo a striscioline.","Tosta il pancarré a dadini in padella con un filo d'olio: ecco i crostini.","Prepara la salsa: maionese allungata con limone e parmigiano.","Condisci l'insalata con la salsa, aggiungi pollo, crostini e scaglie di parmigiano."],
u2:["Tosta 3 fette di pancarré per porzione.","Rosola la pancetta finché è croccante; griglia il pollo a fettine.","Componi a due piani: pane, pollo e insalata; pane, pancetta e pomodoro; pane.","Ferma con stecchini e taglia in diagonale: è il taglio a farlo riconoscere."],
u3:["Prepara una besciamella: burro, farina e latte caldo, mescolando.","Fuori dal fuoco sciogli il cheddar nella besciamella.","Cuoci la pasta molto al dente e condiscila con la crema.","Gratina in forno 10 minuti a 200°: la crosticina è d'obbligo."],
f1:["Fodera uno stampo con la sfoglia bucherellandone il fondo.","Rosola la pancetta; sbatti uova e panna con sale e pepe.","Distribuisci pancetta e scamorza sulla base, versa il composto.","Inforna a 180° per 35 minuti: il centro deve tremare appena.","Riposa 10 minuti: si serve tiepida."],
f2:["Prepara una besciamella densa.","Componi: pane, cotto, scamorza, pane; copri con besciamella e altra scamorza.","Gratina in forno a 200° per 15 minuti fino alla doratura.","Coltello e forchetta: è un toast che si mangia elegante."],
f3:["Prepara la pastella (farina, uova, latte) e falla riposare 30 minuti.","Cuoci le crêpes in padella imburrata, 1 minuto per lato.","Farcisci con cotto e scamorza, piega a fazzoletto.","Ripassa in padella finché il formaggio fila."],
sp1:["Affetta le patate sottili e cuocile lentamente in abbondante olio, senza farle dorare: devono confire.","Scolale e uniscile alle uova sbattute salate; riposa 10 minuti.","Versa in padella calda e cuoci 4-5 minuti a fuoco medio.","Il giro: piatto sopra, capovolgi e fai scivolare per cuocere l'altro lato.","Il cuore deve restare morbido: è il segreto della tortilla."],
sp2:["Rosola il pollo a bocconcini in padella larga (la paellera se ce l'hai).","Unisci il riso e tostalo; sciogli lo zafferano nel brodo caldo.","Versa il brodo, distribuisci piselli e gamberetti e da qui NON mescolare più.","Cuoci 16-18 minuti finché il brodo è assorbito.","Il socarrat, la crosticina sul fondo, è il premio: alza il fuoco l'ultimo minuto."],
g1:["Taglia pomodori e cetrioli a pezzi grossi, la cipolla a velo.","Unisci olive e feta a cubi, senza sbriciolarla troppo.","Condisci con olio e origano; niente aceto, il pomodoro basta.","Servi fresca ma non di frigo."],
g2:["Reidrata il couscous e sgranalo.","Trita abbondantissimo prezzemolo e la menta: sono i protagonisti, non il contorno.","Unisci i pomodori a dadini piccoli.","Condisci con succo di limone e olio; riposa 30 minuti prima di servire."],
o1:["Frulla i ceci con il loro liquido (poco), succo di limone, aglio e olio.","Assaggia e regola: deve essere cremoso e agrumato.","Scalda la pita in padella o forno.","Servi l'hummus con un giro d'olio e paprika; la pita si usa come cucchiaio."],
o2:["Frulla i ceci ben scolati con aglio, prezzemolo e farina fino a un composto modellabile.","Forma polpettine schiacciate e riposale in frigo 20 minuti.","Cuocile in forno a 200° per 20 minuti girandole a metà (o friggile per la versione classica).","Servi con la salsa: yogurt greco, sale, limone e menta se ce l'hai."],
o3:["Marina il pollo con yogurt e spezie (paprika e cumino) 30 minuti.","Griglialo a fettine finché è dorato.","Scalda la piadina, spalma yogurt fresco, aggiungi insalata e pomodori.","Aggiungi il pollo, arrotola stretto e avvolgi in carta: si mangia in mano."],
n1:["Friggi le melanzane a cubetti in olio caldo; scola su carta.","Prepara un sugo di passata con aglio e basilico, 15 minuti.","Cuoci la pasta al dente e saltala nel sugo con le melanzane.","Completa con ricotta (salata se la trovi) grattugiata sopra."],
n2:["Sciogli le acciughe nell'olio a fuoco dolce.","Unisci pelati, olive e capperi dissalati; cuoci 15 minuti.","Salta la pasta al dente nel sugo.","Prezzemolo per chiudere: profumo di Mediterraneo."],
n3:["Rosola la pancetta finché è croccante; unisci i funghi affettati e cuoci 8 minuti.","Sfuma con la panna e spegni subito.","Cuoci la pasta al dente e saltala nella crema.","Pepe abbondante e, se piace, prezzemolo."],
n4:["Sbriciola la salsiccia in padella e rosolala nel suo grasso.","Unisci la zucca a dadini piccoli e cuoci 15 minuti: si scioglierà in crema.","Cuoci la pasta e saltala nel condimento con acqua di cottura.","Parmigiano e pepe per chiudere."],
n5:["Pulisci gli asparagi e taglia le punte; affetta i gambi teneri.","Salta gli asparagi 5 minuti in padella con olio.","Tosta il riso, porta a cottura col brodo caldo.","A metà cottura unisci gli asparagi; manteca con burro e parmigiano."],
n6:["Scalda la passata allungata con un bicchiere d'acqua e salata.","Versa il riso direttamente nel pomodoro e cuoci come un risotto, mescolando.","Aggiungi acqua calda se serve, fino a cottura.","Manteca con parmigiano e basilico: il riso rosso dell'infanzia."],
n7:["Ammolla il pane raffermo in acqua e aceto 10 minuti; strizzalo bene.","Sbriciolalo in una ciotola con pomodori a pezzi e cipolla a velo.","Condisci con olio, sale e basilico abbondante.","Riposa 30 minuti: i sapori devono sposarsi. Piatto povero, nobile, anti-spreco."],
n8:["Metti verdure e patate in acqua fredda salata e porta a bollore.","Cuoci 30 minuti finché tutto è morbido.","Frulla fino alla consistenza che preferisci.","Servi con olio a crudo, parmigiano e crostini."],
r10:["Versa lo yogurt in una ciotola.","Aggiungi la frutta di stagione a pezzetti.","Completa con i cereali al momento: restano croccanti."],
r11:["Scalda il latte senza farlo bollire.","Servilo con i biscotti: la colazione più semplice che c'è."],
r12:["Tosta il pane finché è dorato.","Spalma il burro sul pane caldo, poi la marmellata."],
c1:["Scalda il latte.","Spalma il miele sulle fette biscottate al momento: si inzuppano volentieri."],
c2:["Prepara un caffè ristretto.","Scalda e monta il latte (un barattolo agitato e 30 secondi di microonde funziona).","Versa il caffè nel latte e accompagna col cornetto."],
c3:["Mescola farina e un pizzico di sale; a parte sbatti uovo e latte, poi unisci tutto a pastella liscia.","Scalda una padella con poco burro.","Versa un mestolino per pancake: gira quando affiorano le bollicine, 1 minuto ancora.","Impila e completa con miele."],
c4:["Metti fiocchi e latte in un pentolino.","Cuoci 5 minuti a fuoco dolce mescolando finché cremoso.","Dolcifica col miele e completa con frutta a pezzi."],
c5:["Tosta il pancarré.","Farcisci con cotto e scamorza e chiudi il toast; ripassalo se lo vuoi fuso.","Spremi le arance al momento: la vitamina C non aspetta."],
c6:["Sbatti le uova con sale e una goccia di latte.","Versale nel burro spumeggiante a fuoco dolce.","Mescola lentamente con la spatola: cremose, mai asciutte. Servi col pane tostato."],
c7:["Monta uova e zucchero finché chiare e spumose.","Unisci farina setacciata, burro fuso e latte, mescolando dal basso verso l'alto.","Versa nello stampo a ciambella imburrato.","Forno a 180° per 40 minuti: prova stecchino prima di sfornare."],
c8:["Sbatti uova, latte e un cucchiaio di zucchero.","Immergi le fette di pancarré su entrambi i lati.","Dorale nel burro 2 minuti per lato.","Zucchero (o miele) sopra e servi caldo."],
c9:["Tosta il pane.","Schiaccia l'avocado con limone, sale e pepe; spalmalo sul pane.","Completa con l'uovo in camicia: 3 minuti in acqua a leggero bollore con un goccio d'aceto."],
c10:["Frulla yogurt, banana e metà della frutta: densità da mangiare al cucchiaio.","Versa nella ciotola.","Decora con la frutta restante e il muesli disposti a spicchi: qui l'occhio mangia per primo."],
c11:["Prepara la pastella e falla riposare 30 minuti in frigo.","Cuoci le crêpes sottili in padella imburrata.","Spalma la crema di nocciole e piega a fazzoletto o arrotola."],
c12:["Versa lo yogurt greco nella ciotola.","Miele a filo generoso.","Mandorle tostate 2 minuti in padella: il tocco croccante."],
s1:["Metti merendina e succo nello zaino: la scorta per la scuola è pronta."],
s2:["Lava e taglia la frutta di stagione; un goccio di limone se deve aspettare."],
s3:["Yogurt in coppetta e miele a filo."],
s4:["Spalma la crema di nocciole sul pane, meglio se appena tostato."],
s5:["Spalma il formaggino sui crackers al momento: restano croccanti."],
sn1:["Farcisci il pancarré con cotto e scamorza.","Tosta in padella o tostiera finché fila; taglia a metà in diagonale."],
sn2:["Frulla latte, banana e miele con qualche cubetto di ghiaccio.","Servi subito: la banana ossida in fretta."],
sn3:["Taglia la frutta a pezzetti regolari.","Condisci con succo di limone e poco zucchero; riposa 15 minuti in frigo."],
sn4:["Pane fresco o tostato, olio buono a filo e un pizzico di sale: tre ingredienti, zero difetti."],
sn5:["Prepara il tè lasciando in infusione 3 minuti.","Servi con i biscotti per l'inzuppo."],
sn6:["Due palline di gelato in coppetta; un quadretto di cioccolato sbriciolato sopra se vuoi esagerare."],
sn7:["Sciogli il cioccolato a bagnomaria o al microonde.","Taglia la banana a rondelle e intingi o versa sopra."],
k1:["Schiaccia l'avocado con succo di limone e sale.","Unisci il pomodoro a dadini piccoli.","Servi nella ciotola circondato dai nachos: si finisce sempre troppo presto."],
k2:["Frulla i ceci con olio, limone e sale fino a crema.","Taglia le carote a bastoncini.","Pinzimonio: la merenda sana che i bambini mangiano davvero."],
k3:["Mescola mandorle e quadretti di cioccolato in una ciotolina: energia tascabile."],
};
Object.assign(PROC2,{
z1:["Versa lo yogurt greco in una ciotola.","Unisci il miele e mescola appena.","Spezza le noci grossolanamente e cospargile sopra.","Se ti piace, aggiungi un cucchiaio di fiocchi d'avena per croccantezza."],
z2:["Tosta leggermente le fette di pane.","Spalma la ricotta con il dorso di un cucchiaio.","Distribuisci sopra la marmellata.","Un filo di miele o scorza di limone se vuoi profumarla."],
z3:["Sbuccia la banana e mettila nel frullatore.","Aggiungi latte, fiocchi d'avena e miele.","Frulla 30-40 secondi fino a ottenere una crema liscia.","Versa nel bicchiere: se lo vuoi più denso, usa meno latte."],
z4:["Porta l'acqua a bollore e cala le uova delicatamente.","Cuoci esattamente 4 minuti dal bollore per il tuorlo morbido.","Scola, apri la calotta con un colpetto di coltello.","Taglia il pane a bastoncini, imburra e intingi nel tuorlo."],
z5:["Impasta farina, burro freddo, zucchero e uovo fino a una frolla; riposa 30 minuti in frigo.","Stendi due terzi della frolla in una teglia e bucherella il fondo.","Farcisci con la marmellata e decora con le strisce di frolla avanzata.","Cuoci a 180° per 30-35 minuti finché è dorata; servi una fetta a colazione."],
z6:["Metti a bollore l'acqua salata e cala gli spaghetti.","In padella scalda l'olio con l'aglio a fettine e un pizzico di peperoncino, senza bruciarlo.","Scola la pasta al dente tenendo un mestolo d'acqua.","Salta gli spaghetti nell'olio 1 minuto con l'acqua di cottura, spolvera di prezzemolo e servi."],
z7:["Cuoci la pasta in acqua salata.","Stempera il pesto in una ciotola con un cucchiaio di acqua di cottura, così non cuoce.","Scola la pasta e uniscila al pesto fuori dal fuoco.","Manteca con il parmigiano e servi subito, senza riscaldare il pesto."],
z8:["Ammorbidisci i funghi e affettali; trita la cipolla e falla appassire nel burro.","Tosta il riso 2 minuti, sfuma con il vino bianco e lascia evaporare.","Unisci i funghi e cuoci aggiungendo brodo caldo poco alla volta, 16-18 minuti.","Spegni al dente, manteca con burro e parmigiano, riposa 2 minuti e servi cremoso."],
z9:["Fai appassire la cipolla nel burro; tosta il riso 2 minuti.","Sfuma con il vino, poi cuoci con brodo caldo aggiunto un mestolo alla volta.","A metà cottura sciogli lo zafferano in poco brodo e uniscilo.","Al dente, manteca fuori dal fuoco con burro e parmigiano fino a renderlo all'onda."],
z10:["Taglia le melanzane a cubetti, salale e friggile o rosolale in padella con olio finché dorate.","Prepara un sugo veloce con la passata, aglio e basilico, 10 minuti.","Cuoci la pasta al dente e uniscila al sugo con metà delle melanzane.","Impiatta con le melanzane rimaste e la ricotta salata grattugiata sopra."],
z11:["Prepara un soffritto di sedano, carota e cipolla tritati con un filo d'olio.","Unisci i fagioli (con parte del liquido) e la passata, copri d'acqua e cuoci 15 minuti.","Frulla un mestolo di fagioli e rimettilo nella pentola per dare cremosità.","Cala la pasta piccola e cuoci finché è pronta; servi con un filo d'olio a crudo."],
z12:["Scalda l'olio con aglio e rosmarino, poi togli l'aglio.","Aggiungi i ceci con il loro liquido e un po' d'acqua, cuoci 10 minuti.","Frulla metà ceci per addensare, rimettili in pentola.","Cuoci la pasta piccola direttamente nella zuppa e servi con olio a crudo e pepe."],
z13:["Porta a bollore l'acqua salata per gli gnocchi.","In una padella ampia sciogli il gorgonzola con il latte a fuoco dolce fino a crema.","Cuoci gli gnocchi: sono pronti quando salgono a galla, scolali subito.","Saltali nella crema, aggiungi le noci spezzate e servi caldissimo."],
z14:["Rosola la salsiccia sbriciolata; unisci i funghi affettati e falli asciugare.","Aggiungi un po' di passata e cuoci 5 minuti, poi la panna e regola di sale.","Cuoci la pasta al dente e scolala tenendo acqua di cottura.","Manteca la pasta nel sugo con un goccio d'acqua e servi con pepe."],
z15:["Fai un soffritto leggero di cipolla e carota.","Tosta l'orzo 1 minuto, poi cuoci con brodo caldo aggiunto poco alla volta.","A metà cottura unisci le zucchine a cubetti.","Al dente (circa 30 minuti) manteca con il parmigiano e servi."],
z16:["Taglia le zucchine a rondelle e lo speck a striscioline.","Rosola lo speck 2 minuti, aggiungi le zucchine e cuoci finché tenere.","Unisci la panna e un mestolo di acqua di cottura per la crema.","Salta la pasta al dente nel condimento, manteca col parmigiano e servi."],
z17:["Prepara un ragù rosolando il macinato, aggiungendo la passata e cuocendo 30 minuti.","Fai una besciamella con burro, farina e latte fino ad addensare.","Alterna nella teglia sfoglie, ragù, besciamella e parmigiano, per più strati.","Inforna a 180° per 30-35 minuti finché è gratinata; lascia riposare 10 minuti prima di tagliare."],
z18:["Porta a bollore l'acqua salata e versa la polenta istantanea a pioggia, mescolando.","Cuoci secondo confezione (di solito 5-8 minuti) fino a densità cremosa.","A parte trifola i funghi con aglio, poi aggiungi un po' di passata, 10 minuti.","Versa la polenta nel piatto, coprila con i funghi e spolvera di parmigiano."],
z19:["Batti leggermente le fettine; passale nell'uovo sbattuto e poi nel pangrattato premendo bene.","Cuoci in padella con olio caldo 3-4 minuti per lato, finché dorate e croccanti.","Nel frattempo taglia le patate a spicchi e cuocile al forno a 200° con olio e sale.","Scola la cotoletta su carta assorbente e servi con le patate e uno spicchio di limone."],
z20:["Metti le cosce in una teglia con patate a tocchi, rosmarino, olio e sale.","Inforna a 200° per circa 50-60 minuti.","Gira a metà cottura perché doni colore uniforme.","È pronto quando la pelle è croccante e le patate dorate: lascia riposare 5 minuti."],
z21:["Infarina leggermente i bocconcini e rosolali nell'olio con la cipolla.","Sfuma, unisci la passata, le carote a rondelle e copri d'acqua calda.","Cuoci coperto a fuoco basso 60 minuti, mescolando ogni tanto.","Aggiungi i piselli negli ultimi 10 minuti; la carne dev'essere morbidissima."],
z22:["Taglia le zucchine a rondelle sottili e rosolale in padella finché morbide.","Sbatti le uova con parmigiano, sale e pepe; unisci le zucchine tiepide.","Versa nella padella con un filo d'olio e cuoci a fuoco medio-basso.","Quando è rappresa girala con l'aiuto di un piatto e dora l'altro lato."],
z23:["Ammolla la mollica di pane nel latte, strizzala e uniscila al macinato con uovo e parmigiano.","Forma polpette regolari con le mani leggermente bagnate.","Rosolale in padella, poi aggiungi la passata e cuoci coperte 20 minuti.","Servi con il sugo, ottimo per condire anche un po' di pasta il giorno dopo."],
z24:["Se usi baccalà ammollato, tienilo già dissalato; taglialo a pezzi.","Rosola cipolla e patate a tocchi, unisci la passata e le olive.","Adagia il baccalà, copri e cuoci a fuoco dolce 25-30 minuti senza mescolare troppo.","Le patate devono essere morbide e il sugo denso: servi con crostini."],
z25:["Pulisci le seppie e tagliale ad anelli.","Rosolale con la cipolla, sfuma e unisci la passata.","Cuoci coperto a fuoco basso 30-40 minuti finché tenere; aggiungi i piselli negli ultimi 10 minuti.","Nel frattempo prepara la polenta istantanea secondo confezione.","Completa le seppie con prezzemolo e servile sulla polenta morbida."],
z26:["Taglia i calamari ad anelli e le patate a fettine sottili.","Disponi tutto in teglia con aglio, prezzemolo, olio, sale e pangrattato.","Inforna a 200° per 25-30 minuti.","Gira una volta a metà; servi quando i calamari sono teneri e le patate dorate."],
z27:["Pulisci e spazzola le cozze sotto acqua corrente, scartando quelle aperte.","Fai aprire le cozze in padella coperta con aglio e olio, 5 minuti.","Aggiungi la passata e il prezzemolo, cuoci altri 5 minuti.","Servi con pane tostato per fare la scarpetta nel sughetto."],
z28:["Lessa le cime di rapa 5 minuti, poi scolale.","In padella scalda olio e aglio, aggiungi le cime e insaporiscile.","A parte rosola le salsicce bucherellate finché dorate.","Unisci salsicce e verdura in padella qualche minuto e servi."],
z29:["Lega o rosola l'arista su tutti i lati in casseruola con un filo d'olio.","Aggiungi salvia e rosmarino, versa il latte fino quasi a coprire la carne.","Cuoci coperto a fuoco basso circa 60 minuti, girando ogni tanto.","Affetta la carne, frulla il fondo di cottura per la salsa e nappa le fette."],
z30:["Scalda bene una padella o piastra.","Cuoci l'hamburger 3-4 minuti per lato secondo lo spessore.","Tosta il pane e prepara insalata e pomodoro a fette.","Componi il panino e servi con l'insalata a lato."],
z31:["Rosola i pezzi di coniglio nell'olio con rosmarino finché dorati.","Sfuma con il vino bianco e lascia evaporare.","Unisci la passata e le olive, copri e cuoci a fuoco basso 50-60 minuti.","La carne è pronta quando si stacca dall'osso: servi con il suo sugo."],
z32:["Griglia o rosola le fette di melanzana finché morbide, senza troppo olio.","Prepara un sugo semplice con la passata e il basilico.","Alterna nella teglia melanzane, sugo, mozzarella a pezzetti e parmigiano.","Inforna a 180° per 30 minuti finché gratinata; lascia riposare prima di servire."],
z33:["Taglia la calotta ai peperoni e svuotali dai semi.","Mescola macinato, riso crudo, un po' di passata e parmigiano per il ripieno.","Riempi i peperoni e disponili in teglia con un fondo di passata.","Inforna coperti a 180° per 45-50 minuti finché il riso è cotto e i peperoni morbidi."],
z34:["Taglia i pomodori a fette spesse e la mozzarella a fette.","Alternale sul piatto.","Condisci con olio, sale e foglie di basilico spezzate a mano.","Lascia insaporire 5 minuti prima di servire."],
z35:["Taglia zucca, patata e cipolla a pezzi.","Cuocile in poca acqua o brodo finché morbide, circa 20 minuti.","Frulla fino a crema liscia, regola di sale.","Servi con parmigiano, un filo d'olio e crostini di pane."],
z36:["Taglia le verdure a pezzetti (o usa il misto surgelato) e mettile in pentola con acqua.","Aggiungi le patate a cubetti e i fagioli, cuoci 30-40 minuti.","Cala la pasta piccola e portala a cottura nella minestra.","Servi con parmigiano e un filo d'olio a crudo; ancora meglio riscaldato il giorno dopo."],
z37:["Tosta le fette di pane.","Taglia i pomodori a cubetti e condiscili con olio, sale e basilico.","Strofina il pane con uno spicchio d'aglio se ti piace.","Distribuisci i pomodori sul pane e servi subito, prima che si ammorbidisca."],
z38:["Versa lo yogurt in una coppetta.","Taglia la frutta fresca a pezzetti.","Uniscila allo yogurt.","Un cucchiaino di miele o granola se serve dolcezza."],
z39:["Taglia il pane a fette.","Appoggia sopra i quadretti di cioccolato.","Se piace tiepido, scalda 20 secondi così il cioccolato si ammorbidisce.","La merenda semplice di sempre."],
z40:["Disponi i crackers sul piatto.","Spalma lo stracchino con un coltello.","Un giro di pepe o un filo di miele per un contrasto goloso.","Pronta in un minuto."],
z41:["Mescola noci, mandorle e uvetta in una ciotolina o sacchetto.","Porzione da un pugno: energia e sazietà.","Ideale prima o dopo lo sport.","Tieni una scorta pronta in dispensa."],
z42:["Scalda la piadina in padella 30 secondi per lato.","Farciscila con il prosciutto cotto.","Aggiungi lo stracchino spalmato mentre è calda così si scioglie.","Chiudi a metà, taglia e servi."],
});
Object.assign(PROC2,{
h1:["Porta il latte quasi a bollore, versa i fiocchi d'avena e cuoci 4-5 minuti mescolando fino a crema.","Togli dal fuoco e lascia intiepidire un minuto.","Versa nella ciotola e completa con la frutta a pezzetti.","Cospargi di semi di chia: assorbendo si gonfiano e danno cremosità."],
h2:["Metti lo skyr (o yogurt greco) in una coppa.","Aggiungi la frutta fresca a pezzetti.","Cospargi con i semi misti per croccantezza.","Un filo di miele e servi: colazione proteica pronta in un minuto."],
h3:["Schiaccia la banana con la forchetta fino a purea.","Uniscila all'uovo e ai fiocchi d'avena, mescola in una pastella.","Cuoci piccoli pancake in padella antiaderente calda, 1-2 minuti per lato.","Impila e servi, eventualmente con altra frutta sopra."],
h4:["Tosta il pane.","Schiaccia l'avocado con un pizzico di sale e spalmalo sul pane.","Cuoci le uova come preferisci (in camicia o strapazzate) e adagiale sopra.","Completa con i pomodorini a spicchi e pepe."],
h5:["Versa i fiocchi di latte nella coppetta.","Aggiungi la frutta fresca a cubetti.","Spezza le noci e uniscile.","Un filo di miele e la colazione proteica è pronta."],
h6:["Frulla yogurt, banana, spinaci e frutta fino a crema densa.","Versa in una ciotola.","Decora con semi di chia e altra frutta a piacere.","Mangia col cucchiaio: è più sazia di un frullato da bere."],
h7:["Sciacqua la quinoa e cuocila in acqua salata 12-15 minuti, poi scola e fai intiepidire.","Taglia pomodorini e cetrioli a cubetti.","Unisci alla quinoa con la feta sbriciolata.","Condisci con olio, sale e limone; ottima anche fredda da portare via."],
h8:["Cuoci il riso basmati e lessa o cuoci a vapore i broccoli tenendoli croccanti.","Rosola il petto di pollo a cubetti in padella con poco olio, 6-8 minuti.","Componi la bowl con riso, broccoli e pollo.","Un filo d'olio a crudo e pepe; bilanciata tra carboidrati, proteine e verdura."],
h9:["Scola e sciacqua i ceci.","Uniscili al tonno sgocciolato e ai pomodori a cubetti.","Aggiungi la rucola.","Condisci con olio, sale e limone: piatto unico proteico e veloce."],
h10:["Cuoci il farro in acqua salata 25-30 minuti, scola.","Cuoci la zucca a cubetti al forno o in padella finché morbida.","Unisci farro, zucca e feta sbriciolata.","Aggiungi la rucola e un filo d'olio a crudo."],
h11:["Cuoci il bulgur in acqua salata secondo confezione, poi scola.","Salta i gamberi in padella con poco olio e le zucchine a cubetti, 5 minuti.","Aggiungi i pomodorini.","Unisci il bulgur, mescola e servi tiepido."],
h12:["Lessa le lenticchie in acqua non salata 25-30 minuti finché tenere, scola.","Taglia carote e sedano a cubetti piccoli.","Unisci alle lenticchie con i pomodorini.","Condisci con olio, sale e un goccio di aceto; meglio ancora dopo un'ora di riposo."],
h13:["Cuoci il riso e fallo intiepidire.","Taglia il tofu a cubetti e scottalo in padella, o usalo al naturale.","Lessa gli edamame 4 minuti.","Componi la bowl con riso, tofu, edamame e avocado; condisci con salsa di soia."],
h14:["Scotta le fettine di tacchino in padella 2-3 minuti per lato, poi taglia a striscioline.","Prepara l'insalata con pomodori e mais.","Adagia il tacchino sopra.","Condisci con olio, sale e limone."],
h15:["Prepara il cous cous idratandolo con acqua calda salata pari volume, coperto 5 minuti, poi sgrana con la forchetta.","Salta zucchine e peperoni a cubetti in padella.","Unisci i ceci scolati e le verdure al cous cous.","Un filo d'olio a crudo e servi tiepido o freddo."],
h16:["Fai un soffritto leggero, poi unisci le verdure e la passata.","Aggiungi i legumi con parte del liquido e copri d'acqua.","Cuoci 30 minuti a fuoco medio.","Regola di sale, un filo d'olio a crudo e servi calda."],
h17:["Cuoci il farro e fallo intiepidire.","Rosola il petto di pollo a cubetti, poi taglialo.","Unisci farro, pollo, pomodorini e rucola.","Scaglie di parmigiano e olio a crudo per finire."],
h18:["Scalda la piadina.","Spalma un velo di yogurt greco.","Farcisci con il pollo grigliato a striscioline, insalata e pomodori.","Arrotola stretto, taglia a metà e servi."],
h19:["Disponi il salmone in teglia con le patate a fettine sottili e gli asparagi.","Condisci con olio, sale e pepe.","Inforna a 200° per 18-20 minuti.","Il salmone è pronto quando si sfalda: non asciugarlo troppo."],
h20:["Adagia l'orata su un foglio di carta forno.","Aggiungi pomodorini, olive, olio e sale.","Chiudi il cartoccio e inforna a 190° per 20 minuti.","Apri il cartoccio a tavola per non perdere i profumi."],
h21:["Scalda bene una griglia o padella.","Cuoci il petto di pollo 4-5 minuti per lato.","Griglia zucchine e melanzane a fette con un velo d'olio.","Servi tutto insieme con sale, pepe e un filo d'olio a crudo."],
h22:["Fai appassire gli spinaci in padella, poi strizzali.","Sbatti le uova con i fiocchi di latte, sale e pepe.","Unisci gli spinaci e versa in padella con poco olio.","Cuoci a fuoco medio-basso girando una volta: leggera e proteica."],
h23:["Disponi il merluzzo in teglia con cavolfiore a cimette e patate a fettine.","Condisci con olio, sale e un po' di pangrattato se piace.","Inforna a 200° per 20-25 minuti.","Il pesce è pronto quando è opaco e si sfalda."],
h24:["Trita finemente il tacchino (o usalo macinato) e impastalo con pangrattato, uovo e sale.","Forma polpettine e disponile su teglia con carta forno.","Inforna a 200° per 18-20 minuti girandole a metà.","Servi con insalata fresca: cottura al forno, poco grasso."],
h25:["Taglia il tofu a cubetti e scottalo in padella ben calda finché dorato.","Aggiungi broccoli e peperoni a pezzetti, salta 5-6 minuti tenendoli croccanti.","Sfuma con la salsa di soia.","Servi con il riso basmati lessato a parte."],
h26:["Lessa broccoli, patata e cipolla in poca acqua finché morbidi.","Frulla fino a crema liscia, regola di sale.","Aggiungi un filo d'olio a crudo.","Servi con crostini di pane; leggera e ricca di fibre."],
h27:["Adagia il branzino in teglia con i finocchi a fette sottili.","Condisci con olio, sale e fette di limone.","Inforna a 190° per 20-25 minuti.","I finocchi diventano dolci e il pesce resta morbido."],
h28:["Versa lo yogurt greco in una coppetta.","Aggiungi le mandorle spezzate.","Spuntino proteico che sazia a lungo.","Ottimo dopo l'allenamento."],
h29:["Disponi le gallette sul piatto.","Spalma l'hummus.","Una spolverata di paprika o semi se ti va.","Croccante e saziante, senza appesantire."],
h30:["Taglia la frutta a pezzi.","Cospargi con i semi misti.","Uno spuntino ricco di fibre e grassi buoni.","Pronto in un minuto."],
h31:["Lessa gli edamame nel baccello in acqua salata 4-5 minuti.","Scola e cospargi con un pizzico di sale.","Si sgranano premendo il baccello con i denti.","Snack proteico e divertente."],

/* immagine AI del piatto (generata al volo, gratuita, con seed stabile) */
function seedDi(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return h%99991; }
function imgAI(r,w=640,h=400,fast){
  const cucina=r.cucina&&r.cucina!=="Italiana"?("cucina "+r.cucina.toLowerCase()):"cucina italiana";
  const prompt="fotografia food professionale di "+r.nome+", "+cucina+", piatto servito, luce naturale, realistico, appetitoso, alta qualità";
  return "https://image.pollinations.ai/prompt/"+encodeURIComponent(prompt)+"?width="+w+"&height="+h+"&seed="+seedDi(r.id)+"&nologo=true&nofeed=true"+(fast?"&model=turbo":"");
}
// Pre-carica in background le miniature (bassa concorrenza) così "scaldano" la cache del server
let _preloadFatto=false;
function preloadImmagini(lista){
  if(_preloadFatto)return; _preloadFatto=true;
  const urls=lista.filter(r=>!r.img).map(r=>imgAI(r,160,160,true));
  let i=0,attivi=0; const MAX=3;
  function next(){
    while(attivi<MAX&&i<urls.length){
      const u=urls[i++]; attivi++;
      const im=new Image(); im.onload=im.onerror=()=>{attivi--;next();}; im.src=u;
    }
  }
  next();
}

// Geocoding robusto: Open-Meteo funziona anche aprendo l'app come file locale (file://),
// dove Nominatim viene bloccato. Nominatim resta come fallback per vie/CAP precisi.
async function geocodaZona(q){
  async function openMeteo(name){
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),8000);
    try{
      const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=it&countryCode=IT&name="+encodeURIComponent(name),{signal:ctrl.signal});
      if(!r.ok) return null;
      const j=await r.json(); const f=j.results&&j.results[0];
      return f?{lat:f.latitude,lon:f.longitude,label:[f.name,f.admin3,f.admin1].filter(Boolean).join(", ")}:null;
    }catch(e){ return null; } finally{ clearTimeout(t); }
  }
  const town=q.split(",")[0].trim();
  let g=await openMeteo(q); if(!g && town!==q) g=await openMeteo(town);
  if(g) return g;
  // fallback: Nominatim (utile per via/CAP; può non rispondere da file://)
  try{
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=it&q="+encodeURIComponent(q),{signal:ctrl.signal,headers:{"Accept":"application/json"}});
    clearTimeout(t);
    if(res.ok){ const j=await res.json(); if(j.length) return {lat:+j[0].lat,lon:+j[0].lon,label:j[0].display_name}; }
  }catch(e){}
  throw new Error("Zona non trovata");
}
function fetchTimeout(url,opts,ms){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(t));
}
async function supermercatiVicini(lat,lon,raggio=5000){
  const Q="[out:json][timeout:20];(nwr(around:"+raggio+","+lat+","+lon+")[shop=supermarket];nwr(around:"+raggio+","+lat+","+lon+")[shop=grocery];);out center 40;";
  // Kumi è di solito più veloce e con CORS aperto: proviamo prima quello.
  const endpoints=["https://overpass.kumi.systems/api/interpreter","https://overpass-api.de/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
  let data=null,err=null;
  for(const ep of endpoints){
    try{
      const res=await fetchTimeout(ep,{method:"POST",body:"data="+encodeURIComponent(Q),headers:{"Content-Type":"application/x-www-form-urlencoded"}},14000);
      if(!res.ok){err=new Error("http "+res.status);continue;}
      const ct=res.headers.get("content-type")||"";
      if(!ct.includes("json")){err=new Error("non-json");continue;}
      data=await res.json(); break;
    }catch(e){ err=e; }
  }
  if(!data) throw err||new Error("overpass");
  const seen=new Set();
  return (data.elements||[]).map(el=>{
    const la=el.lat??el.center?.lat, lo=el.lon??el.center?.lon;
    if(la==null||lo==null) return null;
    const t=el.tags||{};
    const nome=t.brand||t.name||t.operator||"Supermercato";
    const via=[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ");
    const citta=t["addr:city"]||t["addr:town"]||t["addr:village"]||t["addr:hamlet"]||t["addr:suburb"]||"";
    return {id:el.type+el.id,nome,lat:la,lon:lo,dist:haversineKm(lat,lon,la,lo),
      via,citta,indirizzo:[via,citta].filter(Boolean).join(", ")};
  }).filter(Boolean).filter(s=>{ const k=s.nome.toLowerCase()+Math.round(s.dist*20); if(seen.has(k))return false; seen.add(k); return true; })
    .sort((a,b)=>a.dist-b.dist).slice(0,12);
}

/* --- parser ingredienti in italiano --- */
function parseNumero(t){
  t=t.trim();
  if(t==="½")return .5; if(t==="¼")return .25; if(t==="¾")return .75;
  const fr=t.match(/^(\d+)\s*\/\s*(\d+)$/); if(fr)return parseInt(fr[1])/parseInt(fr[2]);
  const n=parseFloat(t.replace(",",".")); return isNaN(n)?null:n;
}
const UNITA={kg:["kg"],g:["g","gr","grammi"],l:["l","lt","litri","litro"],cl:["cl"],ml:["ml"],cucchiai:["cucchiai","cucchiaio"],cucchiaini:["cucchiaini","cucchiaino"],bicchieri:["bicchieri","bicchiere"],pz:["pz","pezzi","pezzo","fette","fetta","spicchi","spicchio","foglie","foglia","rametti","rametto","mazzetto","confezione","vasetto","scatola","bustina","panetto"]};
const RX_UNIT="(kg|grammi|gr|g|litri|litro|lt|l|cl|ml|cucchiaini|cucchiaino|cucchiai|cucchiaio|bicchieri|bicchiere|pezzi|pezzo|pz|fette|fetta|spicchi|spicchio|foglie|foglia|rametti|rametto|mazzetto|confezione|vasetto|scatola|bustina|panetto)";
function normUnit(u,q){
  if(!u)return {q,unit:"pz"};
  u=u.toLowerCase();
  if(UNITA.kg.includes(u))return {q:q*1000,unit:"g"};
  if(UNITA.g.includes(u))return {q,unit:"g"};
  if(UNITA.l.includes(u))return {q:q*1000,unit:"ml"};
  if(UNITA.cl.includes(u))return {q:q*10,unit:"ml"};
  if(UNITA.ml.includes(u))return {q,unit:"ml"};
  if(UNITA.cucchiai.includes(u))return {q:q*10,unit:"g"};
  if(UNITA.cucchiaini.includes(u))return {q:q*5,unit:"g"};
  if(UNITA.bicchieri.includes(u))return {q:q*200,unit:"ml"};
  return {q,unit:"pz"};
}
function pulisciNome(n){
  return n.replace(/^\s*di\s+/i,"").replace(/[,;·•]\s*$/,"").replace(/\s+/g," ").trim();
}
function parseIngrediente(raw){
  let s=String(raw).replace(/\s+/g," ").trim();
  const qb=/q\.?\s?b\.?/i.test(s);
  if(qb){ return {nome:pulisciNome(s.replace(/q\.?\s?b\.?/ig,"").trim()),q:0,unit:"pz",qb:true}; }
  // forma "320 g di nome" (numero all'inizio: provala per prima)
  let m=s.match(new RegExp("^([\\d.,\\/½¼¾]+)\\s*"+RX_UNIT+"?\\s+(?:di\\s+)?(.+)$","i"));
  if(m){
    const n=parseNumero(m[1]);
    if(n!=null){ const {q,unit}=normUnit(m[2],n); return {nome:pulisciNome(m[3]),q,unit,qb:false}; }
  }
  // forma "Nome 320 g" (GialloZafferano)
  m=s.match(new RegExp("^(.+?)\\s+([\\d.,\\/½¼¾]+)\\s*"+RX_UNIT+"?\\.?$","i"));
  if(m){
    const n=parseNumero(m[2]);
    if(n!=null){ const {q,unit}=normUnit(m[3],n); return {nome:pulisciNome(m[1]),q,unit,qb:false}; }
  }
  return {nome:pulisciNome(s),q:0,unit:"pz",qb:true};
}

function ingredientiRecenti(planner,g,pa){

function fabbisogno(planner,persone,varianti){
  varianti=varianti||{};
  const m={};
  const addR=(r,fat)=>{
    if(!r||fat<=0)return;
    r.ingredienti.forEach(i=>{
      if(!(i.q>0))return;
      const k=i.nome;
      if(!m[k])m[k]={nome:i.nome,unit:i.unit,categoria:CATEGORIE.includes(i.categoria)?i.categoria:"Dispensa",prezzo:i.prezzo,q:0};
      m[k].q+=i.q*fat;
    });
  };
  GIORNI.forEach(g=>PASTI.forEach(pa=>{
    const rid=planner[g][pa]; if(!rid)return;
    const r=RICETTE.find(x=>x.id===rid); if(!r)return;
    const presenti=persone.filter(p=>p.presenza[g][pa]);
    const vmap=varianti[g+"|"+pa]||{};
    addR(r, presenti.filter(p=>!vmap[p.id]).reduce((s,p)=>s+fattorePersona(p),0));
    presenti.forEach(p=>{
      const vr=vmap[p.id]?RICETTE.find(x=>x.id===vmap[p.id]):null;
      if(vr)addR(vr,fattorePersona(p));
    });
  }));
  return Object.values(m);
}
function listaAcquisto(fabb,dispensa){
  return fabb.map(it=>{
    const inCasaRaw=dispensa[it.nome]?dispensa[it.nome].q:0;
    const inCasa=Math.min(inCasaRaw,it.q);
    const daCoprire=Math.max(0,it.q-inCasaRaw);
    const pk=PACK[it.nome];
    let daComprare=daCoprire,nConf=null,confLabel=null;
    if(daCoprire>1e-9&&pk){
      nConf=Math.max(1,Math.ceil(daCoprire/pk[0]-1e-9));
      daComprare=nConf*pk[0];
      confLabel=nConf+" × "+fmtQ(pk[0],pk[1]);
    }
    const surplus=Math.max(0,daComprare-daCoprire);
    return {...it,inCasa,daCoprire,daComprare,nConf,confLabel,surplus,
      costoNecessario:costoU(daCoprire,it.unit,it.prezzo),
      costoAcquisto:costoU(daComprare,it.unit,it.prezzo),
      costoSurplus:costoU(surplus,it.unit,it.prezzo),
      costoInCasa:costoU(inCasa,it.unit,it.prezzo)};
  }).sort((a,b)=>a.categoria.localeCompare(b.categoria)||a.nome.localeCompare(b.nome));
}
