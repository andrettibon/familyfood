    function tick(){ var el=Date.now()-start; if(mounted()&&el>3000){hide();return;} if(el>15000){ mounted()?hide():fail(); return; } setTimeout(tick,140); }

// Geocoding robusto: Open-Meteo funziona anche aprendo l'app come file locale (file://),
// dove Nominatim viene bloccato. Nominatim resta come fallback per vie/CAP precisi.
async function geocodaZona(q){
  async function openMeteo(name){
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),8000);
    try{
      const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=it&countryCode=IT&name="+encodeURIComponent(name),{signal:ctrl.signal});
      if(!r.ok) return null;
      const j=await r.json(); const f=j.results&&j.results[0];
      return f?{lat:f.latitude,lon:f.longitude,label:[f.name,f.admin3,f.admin1].filter(Boolean).join(", ")}:null;
    }catch(e){ return null; } finally{ clearTimeout(t); }
  }
  const town=q.split(",")[0].trim();
  let g=await openMeteo(q); if(!g && town!==q) g=await openMeteo(town);
  if(g) return g;
  // fallback: Nominatim (utile per via/CAP; può non rispondere da file://)
  try{
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),8000);
    const res=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=it&q="+encodeURIComponent(q),{signal:ctrl.signal,headers:{"Accept":"application/json"}});
    clearTimeout(t);
    if(res.ok){ const j=await res.json(); if(j.length) return {lat:+j[0].lat,lon:+j[0].lon,label:j[0].display_name}; }
  }catch(e){}
  throw new Error("Zona non trovata");
}
function fetchTimeout(url,opts,ms){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(t));
}
async function supermercatiVicini(lat,lon,raggio=5000){
  const Q="[out:json][timeout:20];(nwr(around:"+raggio+","+lat+","+lon+")[shop=supermarket];nwr(around:"+raggio+","+lat+","+lon+")[shop=grocery];);out center 40;";
  // Kumi è di solito più veloce e con CORS aperto: proviamo prima quello.
  const endpoints=["https://overpass.kumi.systems/api/interpreter","https://overpass-api.de/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
  let data=null,err=null;
  for(const ep of endpoints){
    try{
      const res=await fetchTimeout(ep,{method:"POST",body:"data="+encodeURIComponent(Q),headers:{"Content-Type":"application/x-www-form-urlencoded"}},14000);
      if(!res.ok){err=new Error("http "+res.status);continue;}
      const ct=res.headers.get("content-type")||"";
      if(!ct.includes("json")){err=new Error("non-json");continue;}
      data=await res.json(); break;
    }catch(e){ err=e; }
  }
  if(!data) throw err||new Error("overpass");
  const seen=new Set();
  return (data.elements||[]).map(el=>{
    const la=el.lat??el.center?.lat, lo=el.lon??el.center?.lon;
    if(la==null||lo==null) return null;
    const t=el.tags||{};
    const nome=t.brand||t.name||t.operator||"Supermercato";
    const via=[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ");
    const citta=t["addr:city"]||t["addr:town"]||t["addr:village"]||t["addr:hamlet"]||t["addr:suburb"]||"";
    return {id:el.type+el.id,nome,lat:la,lon:lo,dist:haversineKm(lat,lon,la,lo),
      via,citta,indirizzo:[via,citta].filter(Boolean).join(", ")};
  }).filter(Boolean).filter(s=>{ const k=s.nome.toLowerCase()+Math.round(s.dist*20); if(seen.has(k))return false; seen.add(k); return true; })
    .sort((a,b)=>a.dist-b.dist).slice(0,12);
}

function parseNumero(t){
  t=t.trim();

  const fr=t.match(/^(\d+)\s*\/\s*(\d+)$/); if(fr)return parseInt(fr[1])/parseInt(fr[2]);

const UNITA={kg:["kg"],g:["g","gr","grammi"],l:["l","lt","litri","litro"],cl:["cl"],ml:["ml"],cucchiai:["cucchiai","cucchiaio"],cucchiaini:["cucchiaini","cucchiaino"],bicchieri:["bicchieri","bicchiere"],pz:["pz","pezzi","pezzo","fette","fetta","spicchi","spicchio","foglie","foglia","rametti","rametto","mazzetto","confezione","vasetto","scatola","bustina","panetto"]};
const RX_UNIT="(kg|grammi|gr|g|litri|litro|lt|l|cl|ml|cucchiaini|cucchiaino|cucchiai|cucchiaio|bicchieri|bicchiere|pezzi|pezzo|pz|fette|fetta|spicchi|spicchio|foglie|foglia|rametti|rametto|mazzetto|confezione|vasetto|scatola|bustina|panetto)";
function normUnit(u,q){
  if(!u)return {q,unit:"pz"};
  u=u.toLowerCase();
  if(UNITA.kg.includes(u))return {q:q*1000,unit:"g"};
  if(UNITA.g.includes(u))return {q,unit:"g"};
  if(UNITA.l.includes(u))return {q:q*1000,unit:"ml"};
  if(UNITA.cl.includes(u))return {q:q*10,unit:"ml"};
  if(UNITA.ml.includes(u))return {q,unit:"ml"};
  if(UNITA.cucchiai.includes(u))return {q:q*10,unit:"g"};
  if(UNITA.cucchiaini.includes(u))return {q:q*5,unit:"g"};
  if(UNITA.bicchieri.includes(u))return {q:q*200,unit:"ml"};
  return {q,unit:"pz"};
}
function pulisciNome(n){
  return n.replace(/^\s*di\s+/i,"").replace(/[,;·•]\s*$/,"").replace(/\s+/g," ").trim();
}
function parseIngrediente(raw){
  let s=String(raw).replace(/\s+/g," ").trim();
  const qb=/q\.?\s?b\.?/i.test(s);
  if(qb){ return {nome:pulisciNome(s.replace(/q\.?\s?b\.?/ig,"").trim()),q:0,unit:"pz",qb:true}; }
  // forma "320 g di nome" (numero all'inizio: provala per prima)
  let m=s.match(new RegExp("^([\\d.,\\/½¼¾]+)\\s*"+RX_UNIT+"?\\s+(?:di\\s+)?(.+)$","i"));
  if(m){
    const n=parseNumero(m[1]);
    if(n!=null){ const {q,unit}=normUnit(m[2],n); return {nome:pulisciNome(m[3]),q,unit,qb:false}; }
  }
  // forma "Nome 320 g" (GialloZafferano)
  m=s.match(new RegExp("^(.+?)\\s+([\\d.,\\/½¼¾]+)\\s*"+RX_UNIT+"?\\.?$","i"));
  if(m){
    const n=parseNumero(m[2]);
    if(n!=null){ const {q,unit}=normUnit(m[3],n); return {nome:pulisciNome(m[1]),q,unit,qb:false}; }
  }
  return {nome:pulisciNome(s),q:0,unit:"pz",qb:true};
}

  if(typeof im==="string")return im;
  if(Array.isArray(im))return estraiImg(im[0]);
  if(typeof im==="object")return im.url||null;
  return null;
}
async function fetchProxy(target){
  const proxies=[
    u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
    u=>"https://corsproxy.io/?url="+encodeURIComponent(u),
    u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),
  ];
  let lastErr=null;
  for(const p of proxies){
    try{
      const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),25000);
      const r=await fetch(p(target),{signal:ctrl.signal});
      clearTimeout(t);
      if(!r.ok){ lastErr="HTTP "+r.status; continue; }
      const body=await r.text();
      if(body.length>500)return body;
      lastErr="risposta vuota";
    }catch(e){ lastErr=String(e&&e.message||e); }
  }
  throw new Error(lastErr||"rete non raggiungibile");
}
function trovaRecipeLD(html){
  const blocks=[...html.matchAll(/<script[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/gi)];
  for(const b of blocks){
    try{
      const j=JSON.parse(b[1]);
      const arr=Array.isArray(j)?j:(j["@graph"]||[j]);
      for(const o of arr){
        const t=o&&o["@type"];
        if(t==="Recipe"||(Array.isArray(t)&&t.includes("Recipe")))return o;
      }
    }catch(e){}
  }
  return null;
}
async function importaRicetta(url){
  let u=url.trim();
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  const html=await fetchProxy(u);
  const rec=trovaRecipeLD(html);
  if(!rec)throw new Error("Nessuna ricetta trovata in questa pagina. Prova con il link diretto di una singola ricetta.");
  const resa=parseYield(rec.recipeYield);
  const rawIng=rec.recipeIngredient||rec.ingredients||[];
  if(!rawIng.length)throw new Error("La pagina non elenca gli ingredienti in formato leggibile.");
  const ingredienti=rawIng.map(s=>{
    const p=parseIngrediente(s);
    const categoria=categoriaAuto(p.nome);
    return {nome:p.nome,q:p.qb?0:p.q/resa,unit:p.unit,categoria,prezzo:prezzoAuto(categoria,p.unit),qb:p.qb};
  });
  let host=""; try{ host=new URL(u).hostname.replace(/^www\./,""); }catch(e){}
  return {
    nome:String(rec.name||"Ricetta importata").trim(),
    fonte:host, img:estraiImg(rec.image),
    tempo:parseTempo(rec.totalTime)||parseTempo(rec.cookTime)||30,
    resa, ingredienti,
  };
}
function matchGusto(termine,r){
  const terms=SINONIMI[termine.toLowerCase()]||[termine.toLowerCase()];
  return terms.some(t=>{
    if(r.nome.toLowerCase().includes(t))return true;
    return r.ingredienti.some(i=>{const n=i.nome.toLowerCase();return n.includes(t)||t.includes(n);});
  });
}
function conflitti(r,presenti){
  const out=[];
  const alg=allergeniRicetta(r);
  presenti.forEach(p=>{
    (p.allergie||[]).forEach(a=>{ if(alg.includes(a)) out.push({persona:p.nome,motivo:a,tipo:"allergia"}); });
    if(p.dieta==="Vegetariano"&&!isVeg(r)) out.push({persona:p.nome,motivo:"vegetariano",tipo:"dieta"});
    if(p.dieta==="Vegano"&&!isVegan(r)) out.push({persona:p.nome,motivo:"vegano",tipo:"dieta"});
    (p.nonGraditi||[]).forEach(t=>{ if(matchGusto(t,r)) out.push({persona:p.nome,motivo:"non ama "+t.toLowerCase(),tipo:"gusto"}); });
  });
  return out;
}
function costoU(q,unit,prezzo){ return (unit==="g"||unit==="ml") ? (q/1000)*prezzo : q*prezzo; }

function ingredientiRecenti(planner,g,pa){
  const gi=GIORNI.indexOf(g), pi=PASTI.indexOf(pa);
  const s=new Set();
  const addDay=(day,maxPi)=>PASTI.forEach((p2,i2)=>{
    if(maxPi!=null&&i2>=maxPi)return;
    const rid=planner[day]&&planner[day][p2]; if(!rid)return;
    const r=RICETTE.find(x=>x.id===rid); if(r)r.ingredienti.forEach(i=>s.add(i.nome));
  });
  if(gi>0)addDay(GIORNI[gi-1],null);
  addDay(g,pi);
  return s;
}

function fabbisogno(planner,persone,varianti){
  varianti=varianti||{};
  const m={};
  const addR=(r,fat)=>{
    if(!r||fat<=0)return;
    r.ingredienti.forEach(i=>{
      if(!(i.q>0))return;
      const k=i.nome;
      if(!m[k])m[k]={nome:i.nome,unit:i.unit,categoria:CATEGORIE.includes(i.categoria)?i.categoria:"Dispensa",prezzo:i.prezzo,q:0};
      m[k].q+=i.q*fat;
    });
  };
  GIORNI.forEach(g=>PASTI.forEach(pa=>{
    const rid=planner[g][pa]; if(!rid)return;
    const r=RICETTE.find(x=>x.id===rid); if(!r)return;
    const presenti=persone.filter(p=>p.presenza[g][pa]);
    const vmap=varianti[g+"|"+pa]||{};
    addR(r, presenti.filter(p=>!vmap[p.id]).reduce((s,p)=>s+fattorePersona(p),0));
    presenti.forEach(p=>{
      const vr=vmap[p.id]?RICETTE.find(x=>x.id===vmap[p.id]):null;
      if(vr)addR(vr,fattorePersona(p));
    });
  }));
  return Object.values(m);
}
function listaAcquisto(fabb,dispensa){
  return fabb.map(it=>{
    const inCasaRaw=dispensa[it.nome]?dispensa[it.nome].q:0;
    const inCasa=Math.min(inCasaRaw,it.q);
    const daCoprire=Math.max(0,it.q-inCasaRaw);
    const pk=PACK[it.nome];
    let daComprare=daCoprire,nConf=null,confLabel=null;
    if(daCoprire>1e-9&&pk){
      nConf=Math.max(1,Math.ceil(daCoprire/pk[0]-1e-9));
      daComprare=nConf*pk[0];
      confLabel=nConf+" × "+fmtQ(pk[0],pk[1]);
    }
    const surplus=Math.max(0,daComprare-daCoprire);
    return {...it,inCasa,daCoprire,daComprare,nConf,confLabel,surplus,
      costoNecessario:costoU(daCoprire,it.unit,it.prezzo),
      costoAcquisto:costoU(daComprare,it.unit,it.prezzo),
      costoSurplus:costoU(surplus,it.unit,it.prezzo),
      costoInCasa:costoU(inCasa,it.unit,it.prezzo)};
  }).sort((a,b)=>a.categoria.localeCompare(b.categoria)||a.nome.localeCompare(b.nome));
}
function totaleNegozio(items,negozio){
  return items.reduce((s,it)=>{
    const sconto=negozio.offerte[it.categoria]||0;
    return s+it.costoAcquisto*negozio.indice*(1-sconto);
  },0);
}

function suggerisci(nome){
  const s={"Uova":"frittata di recupero nel weekend","Pane":"pangrattato, polpette o bruschette","Latte":"besciamella o pancake","Mozzarella":"caprese il giorno dopo","Patate":"gateau di patate","Insalata mista":"contorno extra","Passata di pomodoro":"congela in porzioni","Yogurt":"colazione extra o salse","Parmigiano":"si conserva a lungo","Broccoli":"pasta ripassata","Carote":"pinzimonio per merenda","Filetto di salmone":"pasta al salmone l'indomani","Petto di pollo":"insalata di pollo","Zucchine":"riso salta-avanzi"};

}

const SHELF_NAME={"Pane":3,"Latte":7,"Yogurt":14,"Insalata mista":4,"Rucola":4,"Mozzarella":6,"Panna fresca":7,"Ricotta":5,"Basilico":4,"Prezzemolo":5,"Funghi":5,"Frutta fresca":6,"Vongole":2};
function catDi(nome){ return ING[nome]?ING[nome][0]:"Dispensa"; }
function giorniConserv(nome,cat){ if(SHELF_NAME[nome]!=null)return SHELF_NAME[nome]; return SHELF_CAT[cat||catDi(nome)]||30; }
function ymdLocale(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isoOggiPiu(giorni){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+giorni); return ymdLocale(d); }
function scadenzaStimata(nome,cat){ return isoOggiPiu(giorniConserv(nome,cat)); }
function giorniAScad(scad){ if(!scad)return null; const p=String(scad).split("-"); if(p.length!==3)return null; const d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0); const o=new Date(); o.setHours(0,0,0,0); return Math.round((d-o)/86400000); }
function urgenzaScad(scad){ const g=giorniAScad(scad); if(g==null)return 1; if(g<=1)return 4; if(g<=3)return 3; if(g<=6)return 2; if(g<=14)return 1; return 0.5; }
function labelScad(scad){ const g=giorniAScad(scad); if(g==null)return {t:"senza data",c:"#9A8F7A"}; if(g<0)return {t:"scaduto",c:"#D14343"}; if(g===0)return {t:"scade oggi",c:"#D14343"}; if(g===1)return {t:"scade domani",c:"#D14343"}; if(g<=3)return {t:"tra "+g+" giorni",c:"#D96C47"}; if(g<=6)return {t:"tra "+g+" giorni",c:"#E5A33D"}; return {t:"tra "+g+" giorni",c:"#2E5941"}; }

function Ring({pct,size=86,color="#2E5941"}){
  const r=(size-10)/2, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);

    <circle cx={size/2} cy={size/2} r={r} stroke="#e7e0d2" strokeWidth="8" fill="none"/>

}

function ImportRicetta({onSalva}){
  const [url,setUrl]=useState("");
  const [stato,setStato]=useState("idle"); // idle|loading|error
  const [errore,setErrore]=useState("");
  const [prev,setPrev]=useState(null); // anteprima parsata
  const [tipo,setTipo]=useState("Pranzo");
  async function vai(){
    if(!url.trim()||stato==="loading")return;
    setStato("loading"); setErrore("");
    try{
      const r=await importaRicetta(url);
      setPrev(r); setTipo("Pranzo"); setStato("idle");
    }catch(e){
      setErrore(String(e&&e.message||e)); setStato("error");
    }
  }
  function salva(){
    onSalva({
      id:"u"+uid(), nome:prev.nome, tipo, icon:iconAuto(prev.nome,tipo),
      img:prev.img, tempo:prev.tempo, fonte:prev.fonte, user:true,
      ingredienti:prev.ingredienti.map(i=>({nome:i.nome,q:i.q,unit:i.unit,categoria:i.categoria,prezzo:i.prezzo})),

  return <div className="card p-4 mb-4 no-print">
    <div className="flex items-center gap-2 mb-2">
      <span className="w-8 h-8 rounded-xl bg-[#D96C47]/10 text-[#D96C47] flex items-center justify-center"><I n="pacco" s={17}/></span>

      </div>
    </div>

      <input value={url} onChange={e=>setUrl(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")vai();}}

      <button onClick={vai} disabled={stato==="loading"}

        {stato==="loading"?"…":"Importa"}</button>
    </div>
    {stato==="loading"&&<div className="text-[11px] font-bold text-stone-400 mt-2 flex items-center gap-1.5"><I n="orologio" s={12}/>Leggo la ricetta dal sito…</div>}
    {stato==="error"&&<div className="text-[11px] font-bold text-rose-600 mt-2 flex items-center gap-1.5"><I n="alert" s={12}/>{errore} Riprova, o prova un altro link.</div>}
    <div className="text-[10px] text-stone-400 mt-2 font-semibold">Serve internet. La ricetta viene salvata nel tuo catalogo e usata come le altre: porzioni, allergie e spesa incluse.</div>

    {prev&&<Modal title="Anteprima importazione" onClose={()=>setPrev(null)}>
      <div className="flex items-center gap-3 mb-3">
        {prev.img?<img src={prev.img} alt="" className="w-14 h-14 rounded-2xl object-cover" onError={e=>{e.target.style.display="none";}}/>:<div className="w-14 h-14 rounded-2xl bg-stone-100 flex items-center justify-center text-stone-400"><I n="ricette" s={24}/></div>}
        <div className="min-w-0">
          <div className="font-extrabold text-[15px] leading-tight">{prev.nome}</div>
          <div className="text-[11px] text-stone-400 font-semibold">{prev.fonte} · dosi originali per {prev.resa} · {prev.tempo}′</div>
        </div>

  const nomiIng=Object.keys(ING).sort();
  const valide=righe.filter(r=>ING[r.n]&&parseFloat(r.q)>0);
  const anteprima={ingredienti:valide.map(r=>{
    const unit=PACK[r.n][1];
    return {nome:r.n,q:parseFloat(r.q),unit,categoria:ING[r.n][0],prezzo:ING[r.n][1]};
  })};
  const kcal=valide.length?kcalRicetta(anteprima):0;
  function salva(){
    if(!nome.trim()||!valide.length)return;

  </Modal>;

/* ================= STEP 2 · RICETTE ================= */
const MACRO_CAT=["Tutte","Italiane","Dal mondo","Healthy"];
function _cuc(r){ return r.cucina||"Italiana"; }
function _tag(r,t){ return (r.tags||[]).indexOf(t)>=0; }
function _isHealthy(r){ return _cuc(r)==="Healthy"||_tag(r,"healthy"); }
const SUB_CAT={
  "Italiane":[["Classiche",r=>_tag(r,"classica")||(!_tag(r,"senza-fornelli")&&!_tag(r,"estiva"))],["Senza fornelli",r=>_tag(r,"senza-fornelli")],["Estive",r=>_tag(r,"estiva")],["Invernali",r=>_tag(r,"inverno")],["Salva-spreco",r=>_tag(r,"salva-spreco")]],
  "Dal mondo":[["Asiatiche",r=>_cuc(r)==="Asiatica"],["Cinesi",r=>_cuc(r)==="Cinese"||r.paese==="cina"],["Giapponesi",r=>_cuc(r)==="Giapponese"||r.paese==="giappone"],["Thai",r=>r.paese==="thailandia"],["Coreane",r=>r.paese==="corea"],["Indiane",r=>_cuc(r)==="Indiana"],["Messicane",r=>_cuc(r)==="Messicana"],["Mediorientali",r=>_cuc(r)==="Mediorientale"],["Mediterranee",r=>_cuc(r)==="Mediterranea"],["Americane",r=>_cuc(r)==="Americana"],["Francesi",r=>_cuc(r)==="Francese"],["Spagnole",r=>_cuc(r)==="Spagnola"]],
  "Healthy":[["Bowl & proteiche",r=>_tag(r,"bowl")||_tag(r,"proteica")],["Leggere / Veg",r=>_tag(r,"vegetariana")||isVeg(r)],["Internazionali",r=>_tag(r,"internazionale")||_cuc(r)!=="Italiana"],["Comfort sano",r=>_tag(r,"comfort")]]
};
function macroMatch(r,m){ if(m==="Tutte")return true; if(m==="Italiane")return _cuc(r)==="Italiana"; if(m==="Healthy")return _isHealthy(r); if(m==="Dal mondo")return _cuc(r)!=="Italiana"&&!_isHealthy(r); return true; }
function subMatch(r,m,s){ if(!s)return true; var arr=SUB_CAT[m]||[]; var f=arr.find(x=>x[0]===s); return !f||f[1](r); }
function StepRicette({persone,likes,setLikes,avanti,ricetteUser,setRicetteUser}){
  const [filtro,setFiltro]=useState("Tutte");
  const [cerca,setCerca]=useState("");

  const [sub,setSub]=useState(null);
  const [mostraImport,setMostraImport]=useState(false);
  const [mostraCrea,setMostraCrea]=useState(false);
  const [dettaglio,setDettaglio]=useState(null);
  function toggle(id){ setLikes(likes.includes(id)?likes.filter(x=>x!==id):[...likes,id]); }
  function elimina(id){ setRicetteUser(ricetteUser.filter(r=>r.id!==id)); setLikes(likes.filter(x=>x!==id)); }
  const cucine=useMemo(()=>["Tutte",...new Set(RICETTE.map(r=>r.cucina||"Italiana"))],[ricetteUser]);
  const q=cerca.trim().toLowerCase();
  const ordTipo={Colazione:0,Pranzo:1,Cena:2,Snack:3};
  const vis=RICETTE.filter(r=>
    (filtro==="Tutte"||r.tipo===filtro)&&
    (vegF==="Tutte"||(vegF==="Vegetariane"&&isVeg(r))||(vegF==="Vegane"&&isVegan(r)))&&
    macroMatch(r,macro)&&subMatch(r,macro,sub)&&
    (!q||r.nome.toLowerCase().includes(q)||r.ingredienti.some(i=>i.nome.toLowerCase().includes(q)))
  ).sort((a,b)=>(ordTipo[a.tipo]??9)-(ordTipo[b.tipo]??9)||a.nome.localeCompare(b.nome));
  return <Sez title="Le vostre ricette" sub={RICETTE.length+" ricette, "+(cucine.length-1)+" cucine dal mondo. Tocca il cuore per i preferiti."}>

    <div className="flex gap-1.5 mb-2 no-print flex-nowrap items-center overflow-x-auto" style={{scrollbarWidth:"none"}}>

    </div>
    <div className="flex gap-2 mb-2 no-print flex-wrap items-center">
      {["Tutte","Vegetariane","Vegane"].map(v=><button key={v} onClick={()=>setVegF(v)} className={"px-3.5 py-1.5 rounded-full text-xs font-bold border transition flex items-center gap-1 "+(vegF===v?"bg-green-600 border-green-600 text-white shadow-sm":"bg-white border-green-300 text-green-700 hover:border-green-500")}>{v!=="Tutte"&&<I n="foglia" s={12}/>}{v}</button>)}

    {macro==="Tutte"&&<div className="mb-4"/>}

    <div className="space-y-2.5">

          </div>)}
        </div>
        <div className="text-[11px] font-extrabold text-stone-400 uppercase tracking-wide mb-1.5">Procedimento</div>
        {Array.isArray(proc)?<ol className="space-y-2.5 mb-1">
          {proc.map((s,i)=><li key={i} className="flex gap-2.5">
            <span className="w-5 h-5 rounded-full bg-[#2E5941] text-white text-[10px] font-extrabold flex items-center justify-center shrink-0 mt-0.5">{i+1}</span>
            <span className="text-sm text-stone-600 leading-relaxed flex-1">{s}</span>
          </li>)}
        </ol>
        :proc?<p className="text-sm text-stone-600 leading-relaxed">{proc}</p>
        :<p className="text-sm text-stone-400 italic">Procedimento non disponibile per questa ricetta{r.fonte?" — consultalo su "+r.fonte:""}.</p>}
        <div className="flex gap-2 mt-5">
          <button onClick={()=>toggle(r.id)} className={"flex-1 rounded-2xl py-2.5 font-bold text-sm flex items-center justify-center gap-2 "+(likes.includes(r.id)?"bg-[#D96C47] text-white":"bg-stone-100 text-stone-500")}>
            <svg viewBox="0 0 24 24" width="16" height="16" fill={likes.includes(r.id)?"currentColor":"none"} stroke="currentColor" strokeWidth="2">{P.cuore}</svg>
            {likes.includes(r.id)?"Nei preferiti":"Aggiungi ai preferiti"}
          </button>
          <Btn onClick={()=>setDettaglio(null)} cls="px-5 py-2.5 rounded-2xl text-sm">Chiudi</Btn>
        </div>
      </Modal>;
    })()}
    <div className="mt-3">
      <Btn onClick={avanti} cls="w-full py-3.5 flex items-center justify-center gap-2">Componi la settimana <I n="freccia" s={17} w={2.2}/></Btn>
      <div className="text-xs text-stone-400 text-center mt-2 font-semibold">{likes.length} preferite {likes.length===0&&"— senza preferiti uso tutto il catalogo"}</div>
    </div>
  </Sez>;
}

/* ================= STEP 3 · PIANO ================= */
function StepPiano({persone,likes,planner,setPlanner,varianti,setVarianti,dispensa,avanti}){
  const [sel,setSel]=useState(null);
  dispensa=dispensa||{};
  // Modalità Frigo: bonus per ricette che usano ciò che è in dispensa (più forte se in scadenza)
  const bonusFrigo=(r)=>{ let b=0; r.ingredienti.forEach(i=>{ if(i.q>0){ const v=dispensa[i.nome]; if(v&&v.q>0) b+=urgenzaScad(v.scad); } }); return Math.min(b*1.3,6); };
  const vociFrigo=Object.entries(dispensa).filter(([n,v])=>v.q>0);
  const inScadenzaFrigo=vociFrigo.filter(([n,v])=>{const g=giorniAScad(v.scad); return g!=null&&g<=3;});
  const [dettaglioP,setDettaglioP]=useState(null);
  function cambiaCasuale(g,pa){
    const presenti=persone.filter(p=>p.presenza[g][pa]);
    const tavola=presenti.filter(p=>!p.dietaIndividuale);
    let opz=RICETTE.filter(r=>tipoMatch(r,pa)&&conflitti(r,tavola).length===0);
    if(!opz.length)opz=RICETTE.filter(r=>tipoMatch(r,pa));
    if(!opz.length)return;
    const cur=planner[g][pa];
    const pool=opz.filter(r=>r.id!==cur); const arr=pool.length?pool:opz;
    const pick=arr[Math.floor(Math.random()*arr.length)];
    if(pick)setPlanner({...planner,[g]:{...planner[g],[pa]:pick.id}});
  }
  const [varFor,setVarFor]=useState(null); // persona per cui scegliere la variante
  const dietPersons=persone.filter(p=>p.dietaIndividuale);
  const [vista,setVista]=useState("fam");
  const pv=dietPersons.find(p=>p.id===vista)||null;
  const pool=likes.length?RICETTE.filter(r=>likes.includes(r.id)):RICETTE;
  function autoPersona(p){
    const nv={...varianti};
    const usatiP={};
    GIORNI.forEach(g=>PASTI.forEach(pa=>{
      if(!p.presenza[g][pa])return;
      const target=(p.kcal||2000)*QUOTA_PASTO[pa];
      const compat=RICETTE.filter(r=>tipoMatch(r,pa)&&conflitti(r,[p]).length===0);
      let best=null,bs=-1e9;
      compat.forEach(r=>{
        const kcalReali=kcalRicetta(r)*fattorePersona(p);
        let s=Math.random()-Math.abs(kcalReali-target)/60;
        if(usatiP[r.id])s-=3;
        if(likes.includes(r.id))s+=1;
        s+=bonusFrigo(r);
        if(s>bs){bs=s;best=r;}
      });
      if(best){
        const k=g+"|"+pa;
        nv[k]={...(nv[k]||{}),[p.id]:best.id};
        usatiP[best.id]=1;
      }
    }));
    setVarianti(nv);
  }
  function svuotaPersona(p){
    const nv={};
    Object.entries(varianti).forEach(([k,m])=>{
      const m2={...m}; delete m2[p.id];
      if(Object.keys(m2).length)nv[k]=m2;
    });
    setVarianti(nv);
  }
  function auto(){
    const np=emptyPlanner();
    const nv={}; // varianti auto per chi ha la dieta individuale
    const usati={}; let nPesce=0,nLegumi=0,nCarneRossa=0;
    const haRosso=r=>r.ingredienti.some(i=>/manzo|vitello|salsiccia|guanciale|pancetta/i.test(i.nome));
    const haPesce=r=>r.ingredienti.some(i=>((ALLG[i.nome]||allergeniAuto(i.nome))).includes("Pesce"));
    const haLegumi=r=>r.ingredienti.some(i=>/cec|fagiol|lenticchi|piselli|legumi/i.test(i.nome));
    const haVerdura=r=>r.ingredienti.some(i=>i.categoria==="Frutta e Verdura"&&i.q>=60);
    GIORNI.forEach(g=>{
      let kcalG=0,targetCum=0;
      PASTI.forEach(pa=>{
        targetCum+=2000*QUOTA_PASTO[pa];
        const presenti=persone.filter(p=>p.presenza[g][pa]);
        if(!presenti.length)return;
        const tavolaComune=presenti.filter(p=>!p.dietaIndividuale);
        let opz=RICETTE.filter(r=>tipoMatch(r,pa)&&conflitti(r,tavolaComune).length===0);
        if(!opz.length)opz=RICETTE.filter(r=>tipoMatch(r,pa));
        const recenti=ingredientiRecenti(np,g,pa);
        let best=null,bestS=-1e9;
        opz.forEach(r=>{
          let s=Math.random()*1.5;
          if(likes.includes(r.id))s+=2;
          s+=usati[r.id]?-2*usati[r.id]:3;                        // varietà: non ripetere
          if(r.recupero&&recenti.has(r.recupero))s+=2.5;          // salva-spreco
          s+=bonusFrigo(r);                                       // Modalità Frigo: usa la dispensa
          if(pa==="Pranzo"||pa==="Cena"){
            if(nPesce<2&&haPesce(r))s+=2;                          // pesce ≥2/settimana
            if(nLegumi<2&&haLegumi(r))s+=2;                        // legumi ≥2/settimana
            if(nCarneRossa>=2&&haRosso(r))s-=3;                    // carne rossa ≤2
            if(haVerdura(r))s+=1;                                  // verdura nel piatto
          }
          s-=Math.abs(kcalG+kcalRicetta(r)-targetCum)/180;         // aderenza al target kcal
          if(s>bestS){bestS=s;best=r;}
        });
        if(best){
          np[g][pa]=best.id; usati[best.id]=(usati[best.id]||0)+1;
          kcalG+=kcalRicetta(best);
          if(pa==="Pranzo"||pa==="Cena"){ if(haPesce(best))nPesce++; if(haLegumi(best))nLegumi++; if(haRosso(best))nCarneRossa++; }
          // piatti individuali per chi segue una dieta: scelti sul SUO target kcal
          presenti.filter(p=>p.dietaIndividuale).forEach(p=>{
            const targetPasto=(p.kcal||2000)*QUOTA_PASTO[pa]; // in kcal reali
            const compat=RICETTE.filter(r=>tipoMatch(r,pa)&&conflitti(r,[p]).length===0);
            let bp=null,bs2=-1e9;
            compat.forEach(r=>{
              // kcal reali per la persona = kcal a porzione standard × il suo fattore
              const kcalReali=kcalRicetta(r)*fattorePersona(p);
              let s2=Math.random()-Math.abs(kcalReali-targetPasto)/60;
              if(usati["v"+p.id+r.id])s2-=3;
              if(bp===null||s2>bs2){bs2=s2;bp=r;}
            });
            if(bp&&bp.id!==best.id){
              const k=g+"|"+pa;
              nv[k]={...(nv[k]||{}),[p.id]:bp.id};
              usati["v"+p.id+bp.id]=1;
            }
          });
        }
      });
    });
    setPlanner(np);
    setVarianti(nv);
  }
  const nAss=GIORNI.reduce((s,g)=>s+PASTI.filter(pa=>planner[g][pa]).length,0);
  return <Sez title="La settimana" sub="Auto compone un menù bilanciato: ~2000 kcal/giorno a porzione, pesce e legumi 2 volte a settimana, poca carne rossa, verdura ogni giorno. Se un piatto non va bene per qualcuno, assegnagli una variante."
    extra={<div className="flex gap-2 no-print">
      <Btn tone="forest" onClick={()=>{pv?autoPersona(pv):auto();}} cls="px-3.5 py-2 text-sm flex items-center gap-1.5"><I n="scintille" s={15}/>Auto</Btn>
      <Btn tone="ghost" onClick={()=>{if(pv){svuotaPersona(pv);}else{setPlanner(emptyPlanner());setVarianti({});}}} cls="px-3.5 py-2 text-sm">Svuota</Btn>
    </div>}>
    {vociFrigo.length>0&&<div className="rounded-2xl bg-[#2E5941]/8 border border-[#2E5941]/20 px-3.5 py-2.5 mb-4 no-print flex items-start gap-2" style={{backgroundColor:"rgba(46,89,65,.07)"}}>
      <span className="text-[#2E5941] mt-0.5 shrink-0"><I n="vaso" s={15}/></span>
      <div className="text-[11px] font-semibold text-[#24463A] leading-snug">
        <b>Modalità Frigo attiva.</b> "Auto" dà priorità alle ricette che usano i {vociFrigo.length} prodotti in dispensa{inScadenzaFrigo.length>0?<span>, prima quelli in scadenza (<b className="text-[#D96C47]">{inScadenzaFrigo.map(([n])=>n).join(", ")}</b>)</span>:""}.
      </div>
    </div>}
    {dietPersons.length>0&&<div className="flex gap-2 mb-4 no-print overflow-x-auto pb-1">
      <button onClick={()=>setVista("fam")} className={"shrink-0 flex items-center gap-1.5 rounded-full px-3.5 py-1.5 text-xs font-extrabold transition "+(!pv?"bg-[#2E5941] text-white shadow":"bg-white border border-stone-200 text-stone-500")}>
        <I n="famiglia" s={13}/>Famiglia</button>
      {dietPersons.map(p=><button key={p.id} onClick={()=>setVista(p.id)} className={"shrink-0 flex items-center gap-1.5 rounded-full pl-1.5 pr-3.5 py-1 text-xs font-extrabold transition "+(vista===p.id?"bg-[#D96C47] text-white shadow":"bg-white border border-stone-200 text-stone-500")}>
        <Avatar p={p} s="w-5 h-5 text-[9px]"/>{p.nome} <span className="opacity-70 font-bold">· dieta</span></button>)}
    </div>}
    {pv&&<div className="fade-in">
      <div className="rounded-3xl bg-[#D96C47]/8 border border-[#D96C47]/25 p-4 mb-4" style={{backgroundColor:"rgba(217,108,71,.06)"}}>
        <div className="text-sm font-extrabold text-[#c55a36]">Il piano di {pv.nome}</div>
        <div className="text-[11px] text-stone-500 font-semibold mt-0.5">Target {pv.kcal||2000} kcal/giorno · porzioni al {Math.round(fattorePersona(pv)*100)}%. I suoi piatti sostituiscono quello di famiglia solo per {pv.nome==="Giorgia"?"lei":pv.nome}; la spesa somma tutto. "Auto" compila la sua settimana sul suo target.</div>
      </div>
      <div className="space-y-3">
        {GIORNI.map((g,gi)=>{
          const pastiP=PASTI.filter(pa=>pv.presenza[g][pa]);
          const kcalP=Math.round(pastiP.reduce((s,pa)=>{
            const k=g+"|"+pa;
            const vrid=(varianti[k]||{})[pv.id];
            const rr=vrid?RICETTE.find(x=>x.id===vrid):(planner[g][pa]?RICETTE.find(x=>x.id===planner[g][pa]):null);
            return s+(rr?kcalRicetta(rr)*fattorePersona(pv):0);
          },0));
          const target=pv.kcal||2000;
          const inTarget=kcalP>=target*0.85&&kcalP<=target*1.15;
          return <div key={g} className="card p-4">
            <div className="flex items-center justify-between mb-2">
              <div className="display font-bold text-[15px] flex items-center gap-2"><span className="w-2 h-2 rounded-full" style={{backgroundColor:DAY_DOT[gi]}}/>{GIORNI_FULL[gi]}</div>
              {kcalP>0&&<span className={"text-[10px] font-extrabold rounded-full px-2 py-0.5 "+(inTarget?"bg-[#2E5941]/10 text-[#2E5941]":"bg-amber-100 text-amber-700")}>{kcalP} / {target} kcal</span>}
            </div>
            <div className="space-y-1.5">
              {pastiP.map(pa=>{
                const k=g+"|"+pa;
                const vrid=(varianti[k]||{})[pv.id];
                const vrec=vrid?RICETTE.find(x=>x.id===vrid):null;
                const main=planner[g][pa]?RICETTE.find(x=>x.id===planner[g][pa]):null;
                return <button key={pa} onClick={()=>{setSel({g,pa,presenti:persone.filter(x=>x.presenza[g][pa])});setVarFor(pv);}}
                  className={"w-full flex items-center gap-2.5 rounded-2xl px-3 py-2 text-left transition border "+(vrec?"bg-[#D96C47]/5 border-[#D96C47]/30 hover:border-[#D96C47]/60":"bg-white border-dashed border-stone-200 hover:border-stone-400")}>
                  <span className={vrec?"text-[#c55a36]":"text-stone-400"}><I n={PASTO_ICON[pa]} s={15}/></span>
                  <span className="text-[11px] font-extrabold uppercase w-[70px] shrink-0 text-stone-400">{pa}</span>
                  <span className="flex-1 min-w-0 truncate">
                    {vrec?<span className="text-[13px] font-bold">{vrec.nome} <span className="text-[10px] text-stone-400 font-bold">{Math.round(kcalRicetta(vrec)*fattorePersona(pv))} kcal</span></span>
                      :main?<span className="text-xs text-stone-400 font-semibold">con la famiglia: {main.nome} · tocca per il suo piatto</span>
                      :<span className="text-xs text-stone-400 font-semibold">scegli il suo piatto…</span>}
                  </span>
                </button>;
              })}
            </div>
          </div>;
        })}
      </div>
    </div>}
    {!pv&&<React.Fragment>
    <div className="space-y-3">
      {GIORNI.map((g,gi)=>{
        const kcalG=PASTI.reduce((s,pa)=>{const rid=planner[g][pa];const r=rid?RICETTE.find(x=>x.id===rid):null;return s+(r?kcalRicetta(r):0);},0);
        return <div key={g} className="card p-4">

          {kcalG>0&&<span className={"text-[10px] font-extrabold rounded-full px-2 py-0.5 "+(kcalG>=1700&&kcalG<=2300?"bg-[#2E5941]/10 text-[#2E5941]":"bg-amber-100 text-amber-700")}>≈ {kcalG} kcal</span>}
        </div>

            const recuperoAttivo=r&&r.recupero&&ingredientiRecenti(planner,g,pa).has(r.recupero);
            if(!presenti.length) return <div key={pa} className="flex items-center gap-2.5 rounded-2xl bg-stone-50 border border-dashed border-stone-200 px-3 py-2 text-stone-300">

            </div>;

                {conf.length>0&&<span className="block text-[10px] font-bold text-rose-600 truncate">{conf.map(c=>c.persona+" ("+c.motivo+")").join(", ")} · usa ▾ per la variante</span>}

    {sel&&(()=>{

      if(varFor){
        const p=varFor;
        const compatibili=RICETTE.filter(r=>tipoMatch(r,sel.pa)&&conflitti(r,[p]).length===0&&(!assegnata||r.id!==assegnata.id));
        const chiudi=()=>{setVarFor(null);if(pv)setSel(null);};
        return <Modal onClose={chiudi} title={(p.dietaIndividuale?"Piatto di ":"Variante per ")+p.nome}>
          <div className="text-xs text-stone-400 font-semibold mb-3">{GIORNI_FULL[GIORNI.indexOf(sel.g)]} · {sel.pa} — {assegnata?"il resto della famiglia mangia "+assegnata.nome+". ":""}La spesa terrà conto di tutti.</div>
          {vmap[p.id]&&<button onClick={()=>{const nv={...varianti};const m={...vmap};delete m[p.id];if(Object.keys(m).length)nv[vkey]=m;else delete nv[vkey];setVarianti(nv);chiudi();}}
            className="w-full text-left px-3 py-2 rounded-xl text-sm font-bold text-rose-600 hover:bg-rose-50 mb-1">{assegnata?"Mangia con la famiglia ("+assegnata.nome+")":"Rimuovi il piatto"}</button>}
          {compatibili.map(r=><button key={r.id} onClick={()=>{setVarianti({...varianti,[vkey]:{...vmap,[p.id]:r.id}});chiudi();}}
            className="w-full flex items-center gap-3 text-left px-3 py-2.5 rounded-2xl mb-1 hover:bg-stone-50">
            <Tile r={r} s="w-10 h-10" foto/>
            <span className="flex-1 text-sm font-bold">{r.nome}</span>
            <span className="text-[10px] text-stone-400 font-bold">{kcalRicetta(r)} kcal</span>
          </button>)}
        </Modal>;
      }
      const recenti=ingredientiRecenti(planner,sel.g,sel.pa);
      const opzioni=[...pool.filter(r=>tipoMatch(r,sel.pa)),...RICETTE.filter(r=>tipoMatch(r,sel.pa)&&!pool.includes(r))];
      opzioni.sort((a,b)=>{
        const ra=a.recupero&&recenti.has(a.recupero)?0:1;
        const rb=b.recupero&&recenti.has(b.recupero)?0:1;
        return ra-rb;
      });
      const confAss=assegnata?conflitti(assegnata,sel.presenti.filter(p=>!p.dietaIndividuale)):[];
      const personeConf=[...new Set([
        ...confAss.map(c=>c.persona),
        ...(assegnata?sel.presenti.filter(p=>p.dietaIndividuale).map(p=>p.nome):[]),
      ])].map(n=>sel.presenti.find(p=>p.nome===n)).filter(Boolean);
      return <Modal onClose={()=>setSel(null)} title={GIORNI_FULL[GIORNI.indexOf(sel.g)]+" · "+sel.pa}>
        <div className="flex items-center gap-1.5 mb-3 flex-wrap">{sel.presenti.map(p=><span key={p.id} className="flex items-center gap-1 text-[11px] font-bold text-stone-500 bg-stone-100 rounded-full pl-1 pr-2 py-0.5"><Avatar p={p} s="w-4.5 h-4.5 text-[8px]" />{p.nome}</span>)}</div>
        {assegnata&&personeConf.length>0&&<div className="rounded-2xl bg-amber-50 border border-amber-200 p-3 mb-3">
          <div className="text-[11px] font-extrabold text-amber-800 mb-1.5">Piatti individuali per questo pasto (allergie, gusti o dieta):</div>
          <div className="flex gap-1.5 flex-wrap">
            {personeConf.map(p=><button key={p.id} onClick={()=>setVarFor(p)}
              className={"flex items-center gap-1.5 text-[11px] font-bold rounded-full pl-1 pr-2.5 py-1 "+(vmap[p.id]?"bg-[#2E5941] text-white":"bg-white border border-amber-300 text-amber-800")}>
              <Avatar p={p} s="w-4.5 h-4.5 text-[8px]"/>{vmap[p.id]?p.nome+" ✓":"Variante per "+p.nome}</button>)}
          </div>
        </div>}
        <button onClick={()=>{setPlanner({...planner,[sel.g]:{...planner[sel.g],[sel.pa]:null}});const nv={...varianti};delete nv[vkey];setVarianti(nv);setSel(null);}} className="w-full text-left px-3 py-2 rounded-xl text-sm font-bold text-rose-600 hover:bg-rose-50 mb-1">Lascia vuoto</button>
        {opzioni.map(r=>{
          const conf=conflitti(r,sel.presenti);
          const pref=likes.includes(r.id);
          const rec=r.recupero&&recenti.has(r.recupero);
          return <button key={r.id} onClick={()=>{setPlanner({...planner,[sel.g]:{...planner[sel.g],[sel.pa]:r.id}});setSel(null);}}
            className={"w-full flex items-center gap-3 text-left px-3 py-2.5 rounded-2xl mb-1 "+(rec?"bg-[#2E5941]/10 hover:bg-[#2E5941]/15":"hover:bg-stone-50")}>
            <Tile r={r} s="w-10 h-10" foto/>
            <span className="flex-1 min-w-0">
              <span className="text-sm font-bold flex items-center gap-1">{r.nome} {pref&&<span className="text-[#D96C47]"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" stroke="none">{P.cuore}</svg></span>}</span>
              {rec&&<span className="block text-[10px] font-extrabold text-[#2E5941]">riusa {r.recupero.toLowerCase()} già in menù</span>}
            </span>
            {conf.length>0&&<Warn tipo={conf[0].tipo==="allergia"?"allergia":"gusto"}>{conf.length}</Warn>}
          </button>;
        })}
      </Modal>;
    })()}

    {dettaglioP&&(()=>{
      const r=dettaglioP; const famF=persone.reduce((s,p)=>s+fattorePersona(p),0);
      const alg=allergeniRicetta(r); const proc=procDi(r);
      return <Modal onClose={()=>setDettaglioP(null)} title="">
        <div className="mb-4">
          <div className={"h-40 rounded-3xl bg-gradient-to-br "+TIPO_TILE[r.tipo]+" flex items-center justify-center relative overflow-hidden"}>
            <I n={r.icon} s={52} w={1.4}/>
            <img src={r.img||imgHost(r)||imgAI(r)} alt="" loading="lazy" className="absolute inset-0 w-full h-full object-cover" onError={e=>imgErr(e,r)}/>
            {!r.img&&<span className="absolute bottom-1.5 right-2 text-[8px] font-bold text-white/80 bg-black/30 rounded-full px-1.5 py-0.5">immagine generata dall'IA</span>}
          </div>
          <h3 className="display font-bold text-xl mt-3 leading-tight">{r.nome}</h3>
          <div className="flex items-center gap-2.5 text-[11px] text-stone-400 font-bold mt-1 flex-wrap">
            <span className="flex items-center gap-1"><I n={r.tipo==="Snack"?"spuntino":PASTO_ICON[r.tipo]} s={12}/>{r.tipo==="Snack"?"Spuntino/Merenda":r.tipo}</span>
            <span className="flex items-center gap-1"><I n="orologio" s={12}/>{r.tempo} min</span>
            <span>{kcalRicetta(r)} kcal/porzione</span>
            {(r.cucina&&r.cucina!=="Italiana")&&<span className="text-[#D96C47]">{r.cucina}</span>}
            {isVeg(r)&&<span className="text-green-600 flex items-center gap-0.5"><I n="foglia" s={12}/>veg</span>}
          </div>
          {alg.length>0&&<div className="flex gap-1 flex-wrap mt-2">{alg.map(a=><Warn key={a} tipo="allergia">{a}</Warn>)}</div>}
        </div>
        <div className="text-[11px] font-extrabold text-stone-400 uppercase tracking-wide mb-1.5">Ingredienti</div>
        <div className="rounded-2xl border border-stone-100 divide-y divide-stone-50 mb-4">
          <div className="px-3 py-1.5 flex text-[9px] font-extrabold text-stone-300 uppercase"><span className="flex-1">Ingrediente</span><span className="w-16 text-right">a persona</span>{famF>0&&<span className="w-20 text-right">famiglia</span>}</div>
          {r.ingredienti.map((i,k)=><div key={k} className="px-3 py-2 flex items-center text-[13px]">
            <span className="flex-1 font-bold truncate">{i.nome}</span>
            <span className="w-16 text-right text-stone-500 font-semibold">{i.q>0?fmtQ(i.q,i.unit):"q.b."}</span>
            {famF>0&&<span className="w-20 text-right text-[#2E5941] font-extrabold">{i.q>0?fmtQ(i.q*famF,i.unit):"—"}</span>}
          </div>)}
        </div>
        <div className="text-[11px] font-extrabold text-stone-400 uppercase tracking-wide mb-1.5">Procedimento</div>
        {Array.isArray(proc)?<ol className="space-y-2.5 mb-1">
          {proc.map((s,i)=><li key={i} className="flex gap-2.5">
            <span className="w-5 h-5 rounded-full bg-[#2E5941] text-white text-[10px] font-extrabold flex items-center justify-center shrink-0 mt-0.5">{i+1}</span>
            <span className="text-sm text-stone-600 leading-relaxed flex-1">{s}</span>
          </li>)}
        </ol>:proc?<p className="text-sm text-stone-600 leading-relaxed">{proc}</p>:<p className="text-sm text-stone-400 italic">Procedimento non disponibile.</p>}
        <div className="mt-5"><Btn onClick={()=>setDettaglioP(null)} cls="w-full py-2.5 rounded-2xl text-sm">Chiudi</Btn></div>
      </Modal>;
    })()}
  </Sez>;
}

/* ================= STEP 4 · SPESA ================= */
function StepSpesa({items,dispensa,setDispensa,checked,setChecked,avanti,nuovaSettimana}){
  const [confermaNS,setConfermaNS]=useState(false);
  const [addDisp,setAddDisp]=useState(false);
  const [qAdd,setQAdd]=useState("");
  const daComprare=items.filter(i=>i.daCoprire>1e-9);
  const coperti=items.filter(i=>i.daCoprire<=1e-9&&i.q>0);
  const totNec=daComprare.reduce((s,i)=>s+i.costoNecessario,0);
  const totAcq=daComprare.reduce((s,i)=>s+i.costoAcquisto,0);
  const totSur=daComprare.reduce((s,i)=>s+i.costoSurplus,0);
  const totCasa=items.reduce((s,i)=>s+i.costoInCasa,0);
  const eff=totAcq>0?Math.round(100*(1-totSur/totAcq)):100;
  const avanzi=daComprare.filter(i=>i.surplus>0&&i.costoSurplus>=0.3).sort((a,b)=>b.costoSurplus-a.costoSurplus).slice(0,5);
  const perCat={}; CATEGORIE.forEach(c=>perCat[c]=daComprare.filter(i=>i.categoria===c));
  const dispensaVoci=Object.entries(dispensa).filter(([n,v])=>v.q>0)
    .sort((a,b)=>{ const ga=giorniAScad(a[1].scad),gb=giorniAScad(b[1].scad); return (ga==null?9999:ga)-(gb==null?9999:gb); });
  const kgEvitato=items.reduce((s,i)=>s+((i.unit==="g"||i.unit==="ml")?i.inCasa/1000:0),0);
  const inScadenza=dispensaVoci.filter(([n,v])=>{const g=giorniAScad(v.scad); return g!=null&&g<=3;});
  const nomiDisp=Object.keys(ING).sort();
  const qA=qAdd.trim().toLowerCase();
  const suggAdd=nomiDisp.filter(n=>!qA||n.toLowerCase().includes(qA)).slice(0,qA?30:0);

  function toggleCasa(i){
    const nd={...dispensa};
    if(i.inCasa>=i.q-1e-9){ delete nd[i.nome]; } else { nd[i.nome]={q:i.q,unit:i.unit,scad:(nd[i.nome]&&nd[i.nome].scad)||scadenzaStimata(i.nome,i.categoria)}; }
    setDispensa(nd);
  }
  function setScad(nome,scad){ const nd={...dispensa}; if(nd[nome]){ nd[nome]={...nd[nome],scad}; setDispensa(nd); } }
  function aggiungiDispensa(nome){
    const nd={...dispensa}; const cat=catDi(nome); const cur=nd[nome]?nd[nome].q:0;
    nd[nome]={q:cur+(PACK[nome]?PACK[nome][0]:1),unit:PACK[nome]?PACK[nome][1]:"pz",scad:(nd[nome]&&nd[nome].scad)||scadenzaStimata(nome,cat)};
    setDispensa(nd);
  }

  if(!items.length) return <Sez title="La spesa"><div className="card p-10 text-center text-stone-400 flex flex-col items-center gap-3"><I n="spesa" s={36} w={1.4}/>Componi prima il planner: la spesa si genera da sola.</div></Sez>;
  return <Sez title="La spesa, senza sprechi" sub="Su chi c'è davvero, meno la dispensa, arrotondata alle confezioni reali."
    extra={<div className="flex gap-2 no-print">
      <button onClick={()=>setConfermaNS(true)} className="w-9 h-9 rounded-full bg-white border border-[#2E5941]/30 text-[#2E5941] flex items-center justify-center" title="Nuova settimana"><I n="aggiorna" s={16}/></button>
      <button onClick={()=>window.print()} className="w-9 h-9 rounded-full bg-white border border-stone-200 text-stone-400 flex items-center justify-center"><I n="stampa" s={16}/></button>
    </div>}>

    <div className="card p-5 mb-4 flex items-center gap-5">
      <div className="relative shrink-0">
        <Ring pct={eff} color={eff>85?"#2E5941":eff>70?"#E5A33D":"#D96C47"}/>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <span className="display text-xl font-bold">{eff}%</span>
          <span className="text-[8px] font-extrabold text-stone-400 uppercase tracking-wide">anti-spreco</span>
        </div>
      </div>
      <div className="flex-1 grid grid-cols-2 gap-x-2 gap-y-3 text-center">
        <div><div className="text-[9px] font-extrabold text-stone-400 uppercase">Necessario</div><div className="font-extrabold text-[15px]">{eur(totNec)}</div></div>
        <div><div className="text-[9px] font-extrabold text-stone-400 uppercase">Al carrello</div><div className="font-extrabold text-[15px]">{eur(totAcq)}</div></div>
        <div><div className="text-[9px] font-extrabold text-stone-400 uppercase">Avanzerà</div><div className="font-extrabold text-[15px] text-[#E5A33D]">{eur(totSur)}</div></div>
        <div><div className="text-[9px] font-extrabold text-stone-400 uppercase">Da casa</div><div className="font-extrabold text-[15px] text-[#2E5941]">{eur(totCasa)}</div></div>
      </div>
    </div>

    {(totCasa>0.01||kgEvitato>0.01)&&<div className="rounded-3xl p-4 mb-4 text-white" style={{background:"linear-gradient(135deg,#2E5941,#3A6B4F)"}}>
      <div className="flex items-center gap-1.5 text-[11px] font-extrabold uppercase tracking-wide text-emerald-100/90 mb-2"><I n="scintille" s={13}/>Questa settimana, grazie alla dispensa</div>
      <div className="flex gap-3">
        <div className="flex-1 rounded-2xl bg-white/12 px-3 py-2.5" style={{backgroundColor:"rgba(255,255,255,.13)"}}>
          <div className="display text-2xl font-bold leading-none">{eur(totCasa)}</div>
          <div className="text-[10px] font-bold text-emerald-100/80 mt-1">risparmiati, non ricomprati</div>
        </div>
        <div className="flex-1 rounded-2xl bg-white/12 px-3 py-2.5" style={{backgroundColor:"rgba(255,255,255,.13)"}}>
          <div className="display text-2xl font-bold leading-none">{kgEvitato>=0.05?kgEvitato.toFixed(1).replace(".",",")+" kg":"—"}</div>
          <div className="text-[10px] font-bold text-emerald-100/80 mt-1">di spreco evitato (stima)</div>
        </div>
      </div>
    </div>}

    {dispensaVoci.length>0&&<div className="rounded-3xl bg-[#2E5941]/8 border border-[#2E5941]/20 p-4 mb-4" style={{backgroundColor:"rgba(46,89,65,.07)"}}>
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-1.5 text-sm font-extrabold text-[#24463A]"><I n="vaso" s={15}/>In dispensa ({dispensaVoci.length})</div>
        <button onClick={()=>setAddDisp(!addDisp)} className="text-[11px] font-extrabold text-[#2E5941] flex items-center gap-1 no-print"><I n="plus" s={12} w={2.6}/>Aggiungi</button>
      </div>
      {inScadenza.length>0&&<div className="text-[11px] font-bold text-[#D96C47] mb-2 flex items-center gap-1"><I n="alert" s={12}/>Da usare presto: {inScadenza.map(([n])=>n).join(", ")}</div>}
      {addDisp&&<div className="mb-3 pop no-print">
        <input value={qAdd} onChange={e=>setQAdd(e.target.value)} placeholder="Cerca un prodotto (es. Latte)…" className="w-full border-2 border-[#2E5941]/30 focus:border-[#2E5941] outline-none rounded-2xl px-3 py-2 text-sm font-semibold bg-white"/>
        {suggAdd.length>0&&<div className="mt-1.5 max-h-44 overflow-y-auto rounded-2xl bg-white border border-stone-100 divide-y divide-stone-50">
          {suggAdd.map(n=><button key={n} onClick={()=>{aggiungiDispensa(n);setQAdd("");}} className="w-full px-3 py-2 flex items-center justify-between text-left hover:bg-stone-50">
            <span className="text-[13px] font-bold text-stone-700">{n}</span>
            <span className="text-[10px] font-semibold text-stone-400">{catDi(n)} · +{PACK[n]?fmtQ(PACK[n][0],PACK[n][1]):"1 pz"}</span>
          </button>)}
        </div>}
        {qA&&!suggAdd.length&&<div className="text-[11px] text-stone-400 font-semibold mt-1 px-1">Nessun prodotto "{qAdd}" nel dizionario.</div>}
      </div>}
      <div className="space-y-1.5">
        {dispensaVoci.map(([n,v])=>{const l=labelScad(v.scad);return <div key={n} className="flex items-center gap-2 bg-white rounded-2xl px-3 py-2 border border-[#2E5941]/15">
          <div className="flex-1 min-w-0">
            <div className="text-[13px] font-bold text-[#24463A] truncate">{n} <span className="text-stone-400 font-semibold">· {fmtQ(v.q,v.unit)}</span></div>
            <div className="text-[10px] font-bold" style={{color:l.c}}>{l.t}</div>
          </div>
          <input type="date" value={v.scad||""} onChange={e=>setScad(n,e.target.value)} className="no-print text-[10px] font-semibold text-stone-500 border border-stone-200 rounded-lg px-1.5 py-1 bg-stone-50" title="Modifica scadenza"/>
          <button onClick={()=>{const nd={...dispensa};delete nd[n];setDispensa(nd);}} className="w-6 h-6 rounded-full bg-[#2E5941]/10 text-[#24463A] flex items-center justify-center shrink-0 no-print"><I n="x" s={11} w={3}/></button>
        </div>;})}
      </div>
      <div className="text-[11px] text-[#2E5941] mt-2 font-semibold">Questi articoli riducono la spesa e guidano la Modalità Frigo nel piano.</div>
    </div>}

    {avanzi.length>0&&<div className="rounded-3xl bg-amber-50 border border-amber-200 p-4 mb-4">
      <div className="flex items-center gap-1.5 text-sm font-extrabold text-amber-800 mb-1.5"><I n="ricicla" s={15}/>Cosa avanzerà</div>
      <div className="text-xs text-amber-700 space-y-1">
        {avanzi.map(a=>{
          const rr=ricettaRecuperoPer(a.nome);
          return <div key={a.nome}>• <b>{a.nome}</b>: {fmtQ(a.surplus,a.unit)} ({eur(a.costoSurplus)}) — {suggerisci(a.nome)}{rr&&<span> · o pianifica <b>{rr.nome}</b></span>}</div>;
        })}
      </div>
      <div className="text-[11px] text-amber-600 font-bold mt-1.5 flex items-center gap-1"><I n="aggiorna" s={11}/>Con "Nuova settimana" gli avanzi passano in dispensa e scontano la prossima spesa.</div>
    </div>}

    {CATEGORIE.filter(c=>perCat[c].length).map(c=><div key={c} className="mb-4">
      <div className="flex items-center justify-between mb-1.5">
        <span className={"inline-flex items-center gap-1.5 text-xs font-extrabold rounded-full px-2.5 py-1 "+CAT_STYLE[c].c}><I n={CAT_STYLE[c].i} s={12}/>{c}</span>
        <span className="text-xs font-bold text-stone-400">{eur(perCat[c].reduce((s,i)=>s+i.costoAcquisto,0))}</span>
      </div>
      <div className="card divide-y divide-stone-50 overflow-hidden">
        {perCat[c].map(i=>{
          const done=checked[i.nome];
          const wastePct=i.daComprare>0?Math.round(100*i.surplus/i.daComprare):0;
          return <div key={i.nome} className="px-4 py-2.5 flex items-center gap-3">
            <button onClick={()=>setChecked({...checked,[i.nome]:!done})} className={"w-5 h-5 rounded-md border-2 flex items-center justify-center shrink-0 no-print "+(done?"bg-[#2E5941] border-[#2E5941] text-white":"border-stone-300 text-transparent")}><I n="check" s={11} w={3.4}/></button>
            <div className="flex-1 min-w-0">
              <div className={"text-[13px] font-bold "+(done?"line-through text-stone-300":"")}>{i.nome}</div>
              <div className="text-[10px] text-stone-400 font-semibold">
                {i.confLabel?i.confLabel:fmtQ(i.daComprare,i.unit)} · serve {fmtQ(i.daCoprire,i.unit)}
                {i.inCasa>0&&<span className="text-[#2E5941]"> · in casa {fmtQ(i.inCasa,i.unit)}</span>}
                {wastePct>0&&<span className="text-[#E5A33D]"> · avanza {wastePct}%</span>}
              </div>
            </div>
            <button onClick={()=>toggleCasa(i)} title="Ce l'ho già" className={"no-print w-8 h-8 rounded-xl flex items-center justify-center "+(i.inCasa>0?"bg-[#2E5941]/10 text-[#2E5941]":"bg-stone-50 text-stone-300 hover:text-stone-400")}><I n="casa" s={15}/></button>
            <div className="text-[13px] font-extrabold w-14 text-right">{eur(i.costoAcquisto)}</div>
          </div>;
        })}
      </div>
    </div>)}

    {coperti.length>0&&<div className="mb-4">
      <div className="flex items-center gap-1.5 text-xs font-extrabold text-[#2E5941] mb-1.5"><I n="check" s={12} w={2.6}/>Già coperto dalla dispensa</div>
      <div className="card divide-y divide-stone-50 overflow-hidden opacity-70">
        {coperti.map(i=><div key={i.nome} className="px-4 py-2 flex items-center gap-3">
          <span className="text-[#2E5941]"><I n="check" s={14} w={2.6}/></span>
          <span className="flex-1 text-[13px] font-bold text-stone-500">{i.nome}</span>
          <span className="text-[10px] text-stone-400 font-semibold">serve {fmtQ(i.q,i.unit)} · in casa</span>
          <button onClick={()=>toggleCasa(i)} className="no-print w-8 h-8 rounded-xl bg-[#2E5941]/10 text-[#2E5941] flex items-center justify-center"><I n="casa" s={15}/></button>
        </div>)}
      </div>
    </div>}

    <div className="mt-6 no-print"><Btn onClick={avanti} cls="w-full py-3.5 flex items-center justify-center gap-2">Dove conviene <I n="freccia" s={17} w={2.2}/></Btn></div>

    {confermaNS&&<Modal title="Nuova settimana" onClose={()=>setConfermaNS(false)}>
      <p className="text-sm text-stone-600 mb-4">Chiudo la settimana: gli avanzi previsti ({avanzi.length>0?avanzi.map(a=>a.nome).join(", "):"nessuno di rilievo"}) passano in <b>dispensa</b> e verranno scalati dalla prossima spesa. Il planner si svuota; famiglia e preferiti restano.</p>
      <div className="flex gap-2">
        <button onClick={()=>setConfermaNS(false)} className="flex-1 rounded-2xl py-2.5 font-bold text-stone-500 bg-stone-100">Annulla</button>
        <Btn tone="forest" onClick={()=>{nuovaSettimana();setConfermaNS(false);}} cls="flex-1 py-2.5 rounded-2xl">Conferma</Btn>
      </div>
    </Modal>}
  </Sez>;
}

/* ================= STEP 5 · NEGOZI ================= */
function StepNegozi({items}){
  const [ordina,setOrdina]=useState("dist");
  const [zona,setZona]=useState(()=>{try{return localStorage.getItem("psf_zona")||"";}catch(e){return "";}});
  const [geo,setGeo]=useState(null);
  const [stores,setStores]=useState(null);
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [copiato,setCopiato]=useState(false);
  const [mostraRicerca,setMostraRicerca]=useState(false);
  const [negozioRicerca,setNegozioRicerca]=useState("amazon");
  const [nascosti,setNascosti]=useState(()=>{try{return JSON.parse(localStorage.getItem("psf_negozi_nascosti")||"[]");}catch(e){return [];}});
  function nascondi(id){ const n=[...new Set([...nascosti,id])]; setNascosti(n); try{localStorage.setItem("psf_negozi_nascosti",JSON.stringify(n));}catch(e){} }
  function ripristinaNascosti(){ setNascosti([]); try{localStorage.removeItem("psf_negozi_nascosti");}catch(e){} }
  const daComprare=items.filter(i=>i.daCoprire>1e-9);
  const tot=daComprare.reduce((s,i)=>s+i.costoAcquisto,0);

  const listaTesto=useMemo(()=>{
    const righe=daComprare.map(i=>"• "+i.nome+(i.daCoprire>0?" — "+fmtQ(i.daCoprire,i.unit):""));
    return "Lista della spesa — Pasto Settimanale Facile\n\n"+righe.join("\n")+"\n\nTotale stimato: "+eur(tot);
  },[items]);

  async function cercaDaCoord(lat,lon,label){
    setGeo({lat,lon,label});
    const s=await supermercatiVicini(lat,lon);
    if(!s.length){ setErr("Nessun supermercato trovato nel raggio di 5 km. Prova con il nome del Comune (es. \"Fara Gera d'Adda\")."); }
    const withCost=s.map(x=>{ const idx=brandIndex(x.nome); return {...x,indice:idx,tot:totaleNegozio(daComprare,{indice:idx,offerte:{}})}; });
    setStores(withCost);
  }

  async function trovaZona(){
    if(!zona.trim())return;
    setLoading(true);setErr("");setStores(null);
    try{ localStorage.setItem("psf_zona",zona); }catch(e){}
    try{
      const g=await geocodaZona(zona);
      await cercaDaCoord(g.lat,g.lon,g.label);
    }catch(e){ setErr(e.message==="Zona non trovata"?"Zona non trovata. Prova a scrivere \"Città, via\" o un CAP.":"Ricerca non riuscita: il servizio mappe è lento o occupato. Riprova tra poco."); }
    setLoading(false);
  }

  function usaPosizione(){
    if(!navigator.geolocation){ setErr("Il tuo browser non supporta la geolocalizzazione. Scrivi la zona a mano."); return; }
    setLoading(true);setErr("");setStores(null);
    navigator.geolocation.getCurrentPosition(
      async pos=>{
        try{ await cercaDaCoord(pos.coords.latitude,pos.coords.longitude,"La tua posizione attuale"); }
        catch(e){ setErr("Ricerca non riuscita: il servizio mappe è lento o occupato. Riprova tra poco."); }
        setLoading(false);
      },
      err2=>{ setLoading(false); setErr(err2.code===1?"Permesso posizione negato. Puoi scrivere la zona a mano.":"Non riesco a leggere la posizione. Scrivi la zona a mano."); },
      {enableHighAccuracy:false,timeout:10000,maximumAge:300000}
    );
  }

  async function copiaLista(){
    try{ await navigator.clipboard.writeText(listaTesto); setCopiato(true); setTimeout(()=>setCopiato(false),2000); }
    catch(e){ setErr("Copia non riuscita: seleziona e copia manualmente la lista in Spesa."); }
  }

  const ranked=useMemo(()=>{
    if(!stores)return null;
    const r=stores.filter(n=>!nascosti.includes(n.id));
    r.sort((a,b)=>ordina==="prezzo"?a.tot-b.tot:a.dist-b.dist);
    return r;
  },[stores,ordina,nascosti]);
  const nNascosti=stores?stores.filter(n=>nascosti.includes(n.id)).length:0;
  const bestPrice=ranked&&ranked.length?Math.min(...ranked.map(r=>r.tot)):0;
  const bestDist=ranked&&ranked.length?Math.min(...ranked.map(r=>r.dist)):0;
  const COLORI=["bg-blue-600","bg-red-600","bg-orange-500","bg-emerald-600","bg-amber-600","bg-teal-600","bg-rose-500","bg-[#24463A]"];

  if(!daComprare.length) return <Sez title="Dove conviene"><div className="card p-10 text-center text-stone-400 flex flex-col items-center gap-3"><I n="negozi" s={36} w={1.4}/>Prima la spesa, poi il supermercato.</div></Sez>;

  return <Sez title="Dove conviene" sub="Trova i supermercati della tua zona, confronta distanza e prezzo stimato, poi ordina online.">

    {/* RICERCA ZONA */}
    <div className="card p-4 mb-5 no-print">
      <div className="flex items-center gap-2 mb-2"><I n="pin" s={16} cls="text-[#D96C47]"/><span className="font-extrabold text-sm">Supermercati vicino a te</span></div>
      <div className="flex gap-2">
        <div className="relative flex-1">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-300"><I n="lente" s={15}/></span>
          <input value={zona} onChange={e=>setZona(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")trovaZona();}}
            placeholder="Comune (es. Fara Gera d'Adda) o città, via"
            className="w-full border-2 border-stone-200 focus:border-[#2E5941] outline-none rounded-2xl pl-9 pr-3 py-2.5 text-sm font-semibold bg-white"/>
        </div>
        <Btn tone="forest" onClick={trovaZona} disabled={loading||!zona.trim()} cls="px-4 py-2.5 text-sm shrink-0">{loading?"…":"Trova"}</Btn>
      </div>
      <button onClick={usaPosizione} disabled={loading} className="mt-2 text-[12px] font-bold text-[#2E5941] flex items-center gap-1.5 disabled:opacity-50"><I n="pin" s={13}/>Usa la mia posizione attuale</button>
      {loading&&<div className="mt-3 flex items-center gap-2.5 text-[12px] font-bold text-stone-500">
        <span className="w-4 h-4 rounded-full border-2 border-stone-200 border-t-[#2E5941] inline-block animate-spin"/>
        Cerco i supermercati nella zona… può richiedere qualche secondo.
      </div>}
      {geo&&!err&&!loading&&<div className="text-[10px] text-stone-400 font-semibold mt-1.5 truncate">📍 {geo.label}</div>}
      {err&&<div className="text-[11px] text-rose-500 font-bold mt-2">{err}</div>}
      <p className="text-[10px] text-stone-400 font-semibold mt-2">Dati mappa © OpenStreetMap. Il <b>prezzo</b> è una stima per insegna: prezzi e volantini reali non sono disponibili via API pubbliche in Italia.</p>
    </div>

    {ranked&&ranked.length>0&&<>
      <div className="flex gap-2 mb-3 no-print">
        <Chip on={ordina==="dist"} onClick={()=>setOrdina("dist")}>Più vicino</Chip>
        <Chip on={ordina==="prezzo"} onClick={()=>setOrdina("prezzo")}>Più conveniente (stima)</Chip>
      </div>
      <div className="rounded-2xl bg-amber-50 border border-amber-200 px-3 py-2 mb-4 text-[11px] font-semibold text-amber-800 flex items-start gap-1.5">
        <span className="mt-0.5 shrink-0"><I n="alert" s={12}/></span>
        <span><b>Anteprima.</b> Supermercati e distanze sono reali (mappa OpenStreetMap). I <b>totali sono una stima</b> per insegna, non i prezzi effettivi del negozio: i prezzi reali arriveranno con la pubblicazione.</span>
      </div>
      <div className="space-y-3 mb-8">
        {ranked.map((n,i)=>{
          const isBest=ordina==="prezzo"?n.tot===bestPrice:n.dist===bestDist;
          const maps="https://www.openstreetmap.org/?mlat="+n.lat+"&mlon="+n.lon+"#map=17/"+n.lat+"/"+n.lon;
          return <div key={n.id} className={"card p-4 flex items-center gap-3.5 "+(isBest?"ring-2 ring-[#2E5941]/60":"")}>
            <div className={"w-11 h-11 rounded-2xl "+COLORI[i%COLORI.length]+" text-white display font-bold text-lg flex items-center justify-center shadow-sm shrink-0"}>{n.nome[0].toUpperCase()}</div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-extrabold text-[15px]">{n.nome}</span>
                {isBest&&<span className="inline-flex items-center gap-1 text-[9px] font-extrabold bg-[#2E5941] text-white rounded-full px-2 py-0.5"><I n="trofeo" s={10} w={2.4}/>{ordina==="prezzo"?"MIGLIORE":"PIÙ VICINO"}</span>}
              </div>
              <div className="flex items-start gap-1 text-[11px] text-stone-400 font-semibold">
                <I n="pin" s={11} cls="mt-0.5 shrink-0"/>
                <span><b className="text-stone-500">{n.dist.toFixed(1)} km</b>{n.via?" · "+n.via:""}{n.citta?" · "+n.citta:""}{!n.via&&!n.citta?" · indirizzo non disponibile sulla mappa":""}</span>
              </div>
              <div className="flex items-center gap-3 mt-0.5 no-print flex-wrap">
                <a href={maps} target="_blank" rel="noopener" className="text-[11px] font-bold text-[#D96C47]">Mappa →</a>
                <a href={linkVolantino(n.nome)} target="_blank" rel="noopener" className="text-[11px] font-bold text-[#2E5941] flex items-center gap-1"><I n="carta" s={11}/>Volantino offerte</a>
                <button onClick={()=>nascondi(n.id)} className="text-[11px] font-bold text-stone-300 hover:text-rose-500">Chiuso? Nascondi</button>
              </div>
            </div>
            <div className="text-right shrink-0">
              <div className="display text-lg font-bold">{eur(n.tot)}</div>
              <div className="text-[9px] text-stone-400 font-bold uppercase">stima carrello</div>
            </div>
          </div>;
        })}
      </div>
    </>}

    {nNascosti>0&&<div className="mb-8 -mt-3 no-print text-center">
      <button onClick={ripristinaNascosti} className="text-[11px] font-bold text-stone-400 hover:text-[#2E5941]">{nNascosti} {nNascosti===1?"negozio nascosto":"negozi nascosti"} · ripristina</button>
    </div>}

    {/* ORDINA ONLINE */}
    <h3 className="display text-lg font-bold mb-1">Spesa a domicilio</h3>
    <div className="rounded-2xl bg-amber-50 border border-amber-200 px-3.5 py-2.5 text-[11px] font-semibold text-amber-800 mb-3 leading-relaxed">
      <b>Come funziona.</b> I siti dei supermercati <u>non</u> accettano una lista incollata in blocco: i prodotti vanno aggiunti uno a uno cercandoli sul loro sito. Perciò copia la lista qui sotto e <b>tienila aperta a fianco</b> come promemoria mentre riempi il carrello. L'aggiunta automatica richiederebbe un accordo diretto col supermercato.
    </div>
    <button onClick={copiaLista} className={"w-full mb-2.5 rounded-2xl py-3 font-extrabold text-sm flex items-center justify-center gap-2 transition "+(copiato?"bg-[#2E5941] text-white":"bg-[#2E5941]/10 text-[#2E5941] hover:bg-[#2E5941]/15")}>
      <I n={copiato?"check":"carta"} s={17} w={2.2}/>{copiato?"Lista copiata negli appunti!":"Copia la lista della spesa ("+daComprare.length+" voci)"}
    </button>
    <button onClick={()=>setMostraRicerca(!mostraRicerca)} className="w-full mb-4 rounded-2xl py-2.5 font-bold text-[13px] flex items-center justify-center gap-2 bg-stone-100 text-stone-600 hover:bg-stone-200 transition">
      <I n="lente" s={15}/>{mostraRicerca?"Nascondi ricerca prodotto per prodotto":"Aggiungi al carrello prodotto per prodotto (senza digitare)"}
    </button>
    {mostraRicerca&&<div className="mb-4 pop">
      <p className="text-[11px] text-stone-500 font-semibold mb-2">Tocca un prodotto: si apre la ricerca già compilata sul negozio, tu premi solo <b>“aggiungi”</b>. Niente da scrivere.</p>
      <div className="flex gap-1.5 mb-2.5 overflow-x-auto pb-1" style={{scrollbarWidth:"none"}}>
        {[{k:"amazon",l:"Amazon"},{k:"everli",l:"Everli"},{k:"carrefour",l:"Carrefour"},{k:"google",l:"Cerca sul web"}].map(o=>
          <button key={o.k} onClick={()=>setNegozioRicerca(o.k)} className={"shrink-0 px-3 py-1 rounded-full text-[11px] font-bold transition "+(negozioRicerca===o.k?"bg-[#2E5941] text-white":"bg-white text-stone-400 border border-stone-200")}>{o.l}</button>)}
      </div>
      <div className="card divide-y divide-stone-50 overflow-hidden">
        {daComprare.map(i=>(
          <a key={i.nome} href={linkRicerca(negozioRicerca,i.nome)} target="_blank" rel="noopener" className="px-4 py-2.5 flex items-center gap-3 hover:bg-stone-50 transition">
            <span className="text-stone-300 shrink-0"><I n="lente" s={14}/></span>
            <span className="flex-1 text-[13px] font-bold text-stone-700 truncate">{i.nome}</span>

    <div className="space-y-2.5">
      {ONLINE.map(s=>(

const STEPS=[
  {id:"famiglia",label:"Famiglia",icon:"famiglia"},
  {id:"ricette",label:"Ricette",icon:"ricette"},
  {id:"piano",label:"Piano",icon:"piano"},
  {id:"spesa",label:"Spesa",icon:"spesa"},
  {id:"negozi",label:"Negozi",icon:"negozi"},
];

function App(){
  const saved=load();
  const [step,setStep]=useState(saved?.step||"famiglia");
  const [persone,setPersone]=useState(saved?.persone||[]);
  const [likes,setLikes]=useState(saved?.likes||[]);
  const [planner,setPlanner]=useState(saved?.planner||emptyPlanner());
  const [checked,setChecked]=useState(saved?.checked||{});
  const [dispensa,setDispensa]=useState(saved?.dispensa||{});
  const [ricetteUser,setRicetteUser]=useState(saved?.ricetteUser||[]);
  const [varianti,setVarianti]=useState(saved?.varianti||{});

  syncRicette(ricetteUser);
  useEffect(()=>{save({step,persone,likes,planner,checked,dispensa,ricetteUser,varianti});},[step,persone,likes,planner,checked,dispensa,ricetteUser,varianti]);
  useEffect(()=>{ const t=setTimeout(()=>preloadImmagini(RICETTE),1200); return ()=>clearTimeout(t); },[]);

  const fabb=useMemo(()=>fabbisogno(planner,persone,varianti),[planner,persone,ricetteUser,varianti]);
  const items=useMemo(()=>listaAcquisto(fabb,dispensa),[fabb,dispensa]);

  function nuovaSettimana(){
    const nd={...dispensa};
    items.forEach(i=>{
      if(i.surplus>1e-9){
        const cur=nd[i.nome]?nd[i.nome].q:0;
        const scadPrec=nd[i.nome]&&nd[i.nome].scad;
        nd[i.nome]={q:cur+i.surplus,unit:i.unit,scad:scadPrec||scadenzaStimata(i.nome,i.categoria)};
      }
    });
    setDispensa(nd);
    setPlanner(emptyPlanner());
    setVarianti({});
    setChecked({});
    setStep("piano");
  }

  const sbloccato={famiglia:true,ricette:persone.length>0,piano:persone.length>0,spesa:persone.length>0,negozi:items.some(i=>i.daCoprire>1e-9)};
  const idx=STEPS.findIndex(s=>s.id===step);

  return <div className="min-h-screen mx-auto max-w-md relative pb-28">
    {/* HEADER */}
    <header className="bg-gradient-to-br from-[#24463A] via-[#2E5941] to-[#3A6B4F] text-white rounded-b-[32px] no-print shadow-lg shadow-[#24463A]/20 relative overflow-hidden">
      <div className="absolute inset-0 pointer-events-none opacity-[0.08]" style={{backgroundImage:"radial-gradient(circle at 1px 1px, #fff 1.2px, transparent 1.3px)",backgroundSize:"22px 22px"}}/>
      <div className="absolute -top-12 -right-8 w-52 h-52 rounded-full pointer-events-none" style={{background:"radial-gradient(circle, rgba(229,163,61,.35), transparent 65%)"}}/>
      <div className="absolute -bottom-16 -left-10 w-44 h-44 rounded-full pointer-events-none" style={{background:"radial-gradient(circle, rgba(217,108,71,.25), transparent 65%)"}}/>
      <div className="px-5 pb-5 relative safetop">
        <div className="flex items-center gap-3">
          <div className="w-11 h-11 rounded-2xl bg-white/12 flex items-center justify-center" style={{backgroundColor:"rgba(255,255,255,.14)"}}><I n="pranzo" s={24} w={1.6}/></div>
          <div className="flex-1">
            <h1 className="display text-[22px] font-bold tracking-tight leading-none">FamilyFood</h1>
            <p className="text-[11px] text-emerald-100/90 font-semibold mt-1">La settimana a tavola, su misura</p>
          </div>
          {persone.length>0&&<div className="flex -space-x-2">{persone.slice(0,5).map(p=><Avatar key={p.id} p={p} s="w-8 h-8 text-[11px] ring-2 ring-[#2E5941]"/>)}</div>}
        </div>
        <div className="flex items-center gap-1 mt-4">
          {STEPS.map((s,i)=><div key={s.id} className={"h-1 flex-1 rounded-full transition-all "+(i<idx?"bg-white/80":i===idx?"bg-[#E5A33D]":"bg-white/20")}/>)}
        </div>
      </div>
    </header>

    <main className="px-4 pt-5">
      {step==="famiglia"&&<StepFamiglia persone={persone} setPersone={setPersone} avanti={()=>setStep("ricette")}/>}
      {step==="ricette"&&<StepRicette persone={persone} likes={likes} setLikes={setLikes} avanti={()=>setStep("piano")} ricetteUser={ricetteUser} setRicetteUser={setRicetteUser}/>}
      {step==="piano"&&<StepPiano persone={persone} likes={likes} planner={planner} setPlanner={setPlanner} varianti={varianti} setVarianti={setVarianti} dispensa={dispensa} avanti={()=>setStep("spesa")}/>}
      {step==="spesa"&&<StepSpesa items={items} dispensa={dispensa} setDispensa={setDispensa} checked={checked} setChecked={setChecked} avanti={()=>setStep("negozi")} nuovaSettimana={nuovaSettimana}/>}
      {step==="negozi"&&<StepNegozi items={items}/>}
      <div className="text-center text-[10px] tracking-wide text-stone-300 pt-8 pb-24 select-none">FamilyFood · v7-DB · {RICETTE.length} ricette</div>
    </main>

    {/* NAV FLOTTANTE */}
    <nav className="fixed bottom-4 inset-x-0 no-print z-40">
      <div className="mx-auto max-w-md px-4">
        <div className="glass rounded-[24px] shadow-xl shadow-[#24463A]/15 border border-white/60 flex justify-between px-2 py-2">
          {STEPS.map(s=>{
            const on=s.id===step, ok=sbloccato[s.id];
            return <button key={s.id} onClick={()=>ok&&setStep(s.id)}
              className={"flex items-center gap-1.5 rounded-2xl px-3 py-2 transition-all "+(on?"bg-[#2E5941] text-white shadow-md":ok?"text-stone-400 hover:text-stone-600":"text-stone-200")}>
              <I n={s.icon} s={19} w={on?2:1.8}/>
              {on&&<span className="text-[11px] font-extrabold">{s.label}</span>}
            </button>;
          })}
        </div>
      </div>
    </nav>
  </div>;
}

}
function applicaCatalogo(list){
  let add=0;
  (list||[]).forEach(function(r){
    if(!r||!r.id)return;
    if(RICETTE_BASE.some(x=>x.id===r.id||(x.nome||"").toLowerCase()===(r.nome||"").toLowerCase()))return;
    RICETTE_BASE.push(r); add++;
  });
  return add;
}
async function caricaCatalogoDB(){
  var _newI={"Brodo vegetale":["Dispensa",0.9,1000,"ml",4],"Patata dolce":["Frutta e Verdura",2.5,1000,"g",86],"Salsa teriyaki":["Dispensa",3.5,250,"ml",130],"Salsa sriracha":["Dispensa",3.0,200,"ml",90],"Burro di arachidi":["Dispensa",4.0,350,"g",590],"Zenzero":["Frutta e Verdura",6.0,100,"g",80]};
  Object.keys(_newI).forEach(function(k){ if(!ING[k])ING[k]=_newI[k].slice(0,4); if(KCAL[k]==null)KCAL[k]=_newI[k][4]; });
  const ric=await supaGet("ricette?select=id,nome,tipo,cucina,paese,tempo,recupero,img_url,ricetta_ingredienti(nome,qta,unita,ordine),ricetta_passi(ordine,testo),ricetta_tag(tag)&limit=5000");
  const built=ric.map(function(row){return costruisciRicetta(row);});
  const n=applicaCatalogo(built);
  try{ localStorage.setItem("ff_catalogo2", JSON.stringify(built)); }catch(e){}
  return n;
}
function catalogoDaCache(){
  try{ return applicaCatalogo(JSON.parse(localStorage.getItem("ff_catalogo2")||"[]")); }catch(e){ return 0; }
}
var __root=null, __shown=-1;
function render(){ if(!__root)__root=ReactDOM.createRoot(document.getElementById("root")); __shown=RICETTE_BASE.length; __root.render(<App key={"c"+__shown}/>); }
function boot(){ if(RICETTE_BASE.length===0)catalogoDaCache(); render(); }
const __bootTimer=setTimeout(boot,6000);
caricaCatalogoDB()
  .then(function(n){ try{console.log("[FamilyFood] "+n+" ricette dal database");}catch(e){} })
  .catch(function(e){ try{console.warn("[FamilyFood] DB non raggiungibile, uso cache locale",e);}catch(_){} })
  .finally(function(){ clearTimeout(__bootTimer); if(__root===null){ boot(); } else if(RICETTE_BASE.length!==__shown){ render(); } });
</script>
